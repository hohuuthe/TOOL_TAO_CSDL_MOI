          name: V6-FULL-DATA-ENCRYPTED
          path: |
            /tmp/v6-data/V6_full_data_package.tar.gz.gpg
            /tmp/v6-data/V6_full_data_package.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Xoa du lieu tho khoi runner
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$V6_DATA_SQL" "$V6_MANIFEST" "$V6_WORK/relations.txt" "$V6_WORK/V6_full_data_package.tar.gz"
          echo "V6 RAW DATA CLEANUP: DONE"

  restore_target:
    name: V6 - Restore FULL DATA vao TARGET moi
    if: github.event_name == 'workflow_dispatch'
    needs: backup_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cai PostgreSQL client va GPG
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release gzip
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Tai encrypted DATA artifact
        if: inputs.save_encrypted_artifact == true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: V6-FULL-DATA-ENCRYPTED
          path: /tmp/v6-restore

      - name: Chuan bi goi DATA cho restore
        shell: bash
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v6-restore

          if [ "${{ inputs.save_encrypted_artifact }}" = "true" ]; then
            test -s /tmp/v6-restore/V6_full_data_package.tar.gz.gpg
            test -s /tmp/v6-restore/V6_full_data_package.sha256
            (cd /tmp/v6-restore && sha256sum -c V6_full_data_package.sha256)

            if [ -z "${BACKUP_PASSWORD:-}" ]; then
              echo "ERROR: Thieu BACKUP_ENCRYPTION_PASSWORD."
              exit 1
            fi
            echo "::add-mask::$BACKUP_PASSWORD"
            printf '%s' "$BACKUP_PASSWORD" | gpg \
              --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt \
              --output /tmp/v6-restore/V6_full_data_package.tar.gz \
              /tmp/v6-restore/V6_full_data_package.tar.gz.gpg

            tar -C /tmp/v6-restore -xzf /tmp/v6-restore/V6_full_data_package.tar.gz
          else
            echo "ERROR: Restore TARGET yeu cau save_encrypted_artifact=true."
            exit 1
          fi

          test -s /tmp/v6-restore/V6_full_data.sql
          test -s /tmp/v6-restore/V6_row_counts.tsv

      - name: Preflight TARGET
        shell: bash
        env:
          SOURCE_SECRET: ${{ secrets.SOURCE_DB_URL }}
          TARGET_SECRET: ${{ secrets.TARGET_DB_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "${SOURCE_SECRET:-}" ] || [ -z "${TARGET_SECRET:-}" ]; then
            echo "ERROR: Can SOURCE_DB_URL va TARGET_DB_URL."
            exit 1
          fi
          echo "::add-mask::$SOURCE_SECRET"
          echo "::add-mask::$TARGET_SECRET"

          SOURCE_URL="${SOURCE_SECRET/:6543/:5432}"
          TARGET_URL="${TARGET_SECRET/:6543/:5432}"
          echo "::add-mask::$SOURCE_URL"
          echo "::add-mask::$TARGET_URL"

          identity() {
            printf '%s' "$1" | sed -E 's#^[^:]+://([^:]+):[^@]*@([^/:?]+).*#\1@\2#'
          }
          SRC_ID=$(identity "$SOURCE_URL")
          TGT_ID=$(identity "$TARGET_URL")
          if [ -z "$SRC_ID" ] || [ -z "$TGT_ID" ] || [ "$SRC_ID" = "$TGT_ID" ]; then
            echo "ERROR: SOURCE va TARGET giong nhau hoac khong xac dinh duoc."
            exit 1
          fi

          SRC_MAJOR=$(/usr/lib/postgresql/17/bin/psql "$SOURCE_URL" -X -Atq -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int / 10000;")
          TGT_MAJOR=$(/usr/lib/postgresql/17/bin/psql "$TARGET_URL" -X -Atq -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int / 10000;")
          test "$SRC_MAJOR" = "$TGT_MAJOR"

          # DATA-ONLY: moi relation trong backup phai ton tai tren TARGET va phai trong.
          while IFS=$'\t' read -r rel expected; do
            [ -n "$rel" ] || continue
            exists=$(/usr/lib/postgresql/17/bin/psql "$TARGET_URL" -X -Atq -v ON_ERROR_STOP=1 -v rel="$rel" -c "SELECT to_regclass(:'rel') IS NOT NULL;")
            if [ "$exists" != "t" ]; then
              echo "ERROR: TARGET thieu relation $rel. Hay chay V5 tao cau truc truoc."
              exit 1
            fi
            current=$(/usr/lib/postgresql/17/bin/psql "$TARGET_URL" -X -Atq -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM $rel;")
            if [ "$current" != "0" ]; then
              echo "ERROR: TARGET relation $rel khong trong (rows=$current). V6 khong ghi de data."
              exit 1
            fi
          done < /tmp/v6-restore/V6_row_counts.tsv

          echo "TARGET_URL=$TARGET_URL" >> "$GITHUB_ENV"
          echo "V6 TARGET PREFLIGHT: PASSED"

      - name: Restore FULL DATA vao TARGET trong transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/lib/postgresql/17/bin/psql "$TARGET_URL" -X \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            -c "SET session_replication_role = replica;" \
            -f /tmp/v6-restore/V6_full_data.sql

          echo "V6 TARGET DATA RESTORE: COMMITTED"

      - name: Verify row counts TARGET
        shell: bash
        run: |
          set -Eeuo pipefail
          mismatches=0
          checked=0
          while IFS=$'\t' read -r rel expected; do
            [ -n "$rel" ] || continue
            actual=$(/usr/lib/postgresql/17/bin/psql "$TARGET_URL" -X -Atq -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM $rel;")
            checked=$((checked+1))
            if [ "$actual" != "$expected" ]; then
              echo "MISMATCH $rel source=$expected target=$actual"
              mismatches=$((mismatches+1))
            fi
          done < /tmp/v6-restore/V6_row_counts.tsv

          echo "V6_TARGET_VERIFIED_TABLES=$checked"
          echo "V6_TARGET_MISMATCHES=$mismatches"
          test "$checked" = "${{ needs.backup_and_verify.outputs.dump_tables }}"
          test "$mismatches" -eq 0

          target_auth=$(/usr/lib/postgresql/17/bin/psql "$TARGET_URL" -X -Atq -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM auth.users;")
          test "$target_auth" = "${{ needs.backup_and_verify.outputs.auth_users }}"

          echo "V6 TARGET FULL DATA VERIFY: PASSED"

      - name: Xoa DATA tam khoi runner
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf /tmp/v6-restore
          echo "V6 TARGET TEMP DATA CLEANUP: DONE"
