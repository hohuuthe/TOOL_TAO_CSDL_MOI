name: Supabase Database Clone V4 FINAL - Maximum Assurance Logical Clone + Compatibility Hardened Verification

# QUAN TRỌNG:
# - Đây là logical clone có kiểm chứng, không âm thầm bỏ qua sai khác.
# - Hosted Supabase có các thành phần platform-managed và secrets nằm ngoài phạm vi pg_dump.
# - strict_mode=true sẽ DỪNG nếu phát hiện thành phần không thể chứng minh đã sao chép đúng.
# - Nếu cần bản sao vật lý/binary gần tuyệt đối nhất, ưu tiên tính năng "Restore to a New Project" của Supabase.
#
# REQUIRED SECRETS:
# - SOURCE_DB_URL, TARGET_DB_URL
# - BACKUP_ENCRYPTION_PASSWORD nếu save_backup_artifact=true
# - SOURCE_PROJECT_REF, TARGET_PROJECT_REF, SUPABASE_ACCESS_TOKEN nếu dùng Vault/pgsodium
#
# TARGET PREREQUISITES:
# - Project Supabase mới/sạch; strict_mode yêu cầu cùng PostgreSQL exact server_version_num + locale/collation.
# - Hỗ trợ kiểm chứng catalog PostgreSQL 15/16/17/18; từ chối major ngoài phạm vi đã kiểm thử tĩnh.
# - Các extension phải được enable sẵn với đúng version + schema như SOURCE.
# - Nên chạy trong maintenance window; strict_mode sẽ dừng nếu SOURCE thay đổi trong lúc backup.
# - Full forensic dump dùng serializable-deferrable làm snapshot witness; split dump chính thức được đối chiếu canonical COPY hash với witness.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/Sao_chep_CSDL_moi_V4_FINAL.yml'
  workflow_dispatch:
    inputs:
      xac_nhan:
        description: 'Gõ chính xác SAO_CHEP_100 để cho phép ghi vào TARGET_DB_URL'
        required: true
        type: string
      strict_mode:
        description: 'BẮT BUỘC true ở V4 FINAL: fail-closed khi không chứng minh được clone chính xác'
        required: true
        default: true
        type: boolean
      copy_vault_root_key:
        description: 'Sao chép Supabase Vault/pgsodium root encryption key qua Management API khi cần'
        required: true
        default: true
        type: boolean
      save_backup_artifact:
        description: 'Lưu bộ backup + báo cáo dưới dạng Artifact ĐÃ MÃ HÓA (cần secret BACKUP_ENCRYPTION_PASSWORD)'
        required: true
        default: true
        type: boolean
      deep_verify_data_dump:
        description: 'BẮT BUỘC true ở V4 FINAL: canonical COPY SHA-256 độc lập thứ tự dòng'
        required: true
        default: true
        type: boolean

concurrency:
  group: supabase-database-clone
  cancel-in-progress: false

jobs:
  clone_database:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[RUN_V4_FINAL_TEST]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      WORK_DIR: clone-work
      BACKUP_DIR: clone-work/backup
      REPORT_DIR: clone-work/report
      PGOPTIONS: '-c statement_timeout=0 -c lock_timeout=30000 -c timezone=UTC -c datestyle=ISO,MDY -c intervalstyle=postgres'

    steps:
      - name: Cài PostgreSQL Client 18 và công cụ hỗ trợ
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg jq diffutils zstd lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          PGDG_FPR=$(gpg --batch --with-colons --show-keys /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            | awk -F: '$1=="fpr" {print $10; exit}')
          if [ "$PGDG_FPR" != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]; then
            echo "ERROR: PostgreSQL PGDG repository signing-key fingerprint không khớp official fingerprint."
            exit 1
          fi
          echo "PGDG key fingerprint: VERIFIED"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version
          /usr/lib/postgresql/18/bin/pg_dump --version

      # Pin CLI v3.0.0: tránh thay đổi hành vi bất ngờ của bản latest.
      - name: Cài Supabase CLI 3.0.0
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Xác nhận contract Supabase CLI v3 trước khi chạy
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase --version | tee "$RUNNER_TEMP/supabase-cli-version.txt"
          supabase db dump --help > "$RUNNER_TEMP/supabase-db-dump-help.txt"
          grep -q -- '--remote' "$RUNNER_TEMP/supabase-db-dump-help.txt"
          grep -q -- '--role-only' "$RUNNER_TEMP/supabase-db-dump-help.txt"
          grep -q -- '--data-only' "$RUNNER_TEMP/supabase-db-dump-help.txt"
          grep -q -- '--use-copy' "$RUNNER_TEMP/supabase-db-dump-help.txt"
          echo "CLI CONTRACT CHECK: PASSED"

      - name: Khởi tạo và kiểm tra an toàn trước khi sao chép
        shell: bash
        env:
          SOURCE_DB_URL_SECRET: ${{ secrets.SOURCE_DB_URL }}
          TARGET_DB_URL_SECRET: ${{ secrets.TARGET_DB_URL }}
          SOURCE_PROJECT_REF_SECRET: ${{ secrets.SOURCE_PROJECT_REF }}
          TARGET_PROJECT_REF_SECRET: ${{ secrets.TARGET_PROJECT_REF }}
          BACKUP_ENCRYPTION_PASSWORD_SECRET: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          SAVE_BACKUP_ARTIFACT: ${{ github.event_name == 'push' && 'false' || inputs.save_backup_artifact }}
          DEEP_VERIFY_DATA_DUMP: ${{ github.event_name == 'push' && 'true' || inputs.deep_verify_data_dump }}
          STRICT_MODE: ${{ github.event_name == 'push' && 'true' || inputs.strict_mode }}
          CONFIRM_TEXT: ${{ github.event_name == 'push' && 'SAO_CHEP_100' || inputs.xac_nhan }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$BACKUP_DIR" "$REPORT_DIR" "$WORK_DIR/artifact-safe"

          if [ "$CONFIRM_TEXT" != "SAO_CHEP_100" ]; then
            echo "ERROR: Chưa xác nhận thao tác ghi vào CSDL đích."
            exit 1
          fi
          if [ "$STRICT_MODE" != "true" ]; then
            echo "ERROR: V4 FINAL không cho phép strict_mode=false; đây là workflow fail-closed bắt buộc."
            exit 1
          fi
          if [ "$DEEP_VERIFY_DATA_DUMP" != "true" ]; then
            echo "ERROR: V4 FINAL không cho phép tắt deep_verify_data_dump."
            exit 1
          fi

          if [ -z "${SOURCE_DB_URL_SECRET:-}" ] || [ -z "${TARGET_DB_URL_SECRET:-}" ]; then
            echo "ERROR: Phải cấu hình cả SOURCE_DB_URL và TARGET_DB_URL trong GitHub Actions Secrets."
            exit 1
          fi

          if [ "$SAVE_BACKUP_ARTIFACT" = "true" ] && [ -z "${BACKUP_ENCRYPTION_PASSWORD_SECRET:-}" ]; then
            echo "ERROR: save_backup_artifact=true yêu cầu secret BACKUP_ENCRYPTION_PASSWORD để không upload dữ liệu thô."
            exit 1
          fi
          if [ "$SAVE_BACKUP_ARTIFACT" = "true" ] && [ "${#BACKUP_ENCRYPTION_PASSWORD_SECRET}" -lt 20 ]; then
            echo "ERROR: BACKUP_ENCRYPTION_PASSWORD phải có tối thiểu 20 ký tự."
            exit 1
          fi

          normalize_url() {
            local u="$1"
            if [[ "$u" == *".pooler.supabase.com:6543/"* ]]; then
              u="${u/:6543\//:5432\/}"
            fi
            printf '%s' "$u"
          }

          enforce_tls_url() {
            local u="$1"
            if [[ "$u" != postgres://* && "$u" != postgresql://* ]]; then
              echo "ERROR: DB URL phải bắt đầu bằng postgres:// hoặc postgresql://" >&2
              return 1
            fi
            local unsafe_ssl_re='(^|[?&])sslmode=(disable|allow|prefer)(&|$)'
            if [[ "$u" =~ $unsafe_ssl_re ]]; then
              echo "ERROR: Từ chối DB URL có sslmode không an toàn; cần require/verify-ca/verify-full." >&2
              return 1
            fi
            if [[ "$u" != *"sslmode="* ]]; then
              if [[ "$u" == *\?* ]]; then u="${u}&sslmode=verify-full"; else u="${u}?sslmode=verify-full"; fi
            fi
            printf '%s' "$u"
          }

          extract_project_ref() {
            local u="$1"
            if [[ "$u" =~ postgres\.([a-z0-9]+): ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
              return 0
            fi
            if [[ "$u" =~ db\.([a-z0-9]+)\.supabase\.co ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
              return 0
            fi
            printf ''
          }

          SOURCE_DB_URL="$(enforce_tls_url "$(normalize_url "$SOURCE_DB_URL_SECRET")")"
          TARGET_DB_URL="$(enforce_tls_url "$(normalize_url "$TARGET_DB_URL_SECRET")")"

          mask_url_credentials() {
            local u="$1"
            echo "::add-mask::$u"
            if [[ "$u" =~ ^postgres(ql)?://[^:]+:([^@]+)@ ]]; then
              echo "::add-mask::${BASH_REMATCH[2]}"
            fi
          }
          mask_url_credentials "$SOURCE_DB_URL"
          mask_url_credentials "$TARGET_DB_URL"
          if [ -n "${BACKUP_ENCRYPTION_PASSWORD_SECRET:-}" ]; then
            echo "::add-mask::$BACKUP_ENCRYPTION_PASSWORD_SECRET"
          fi

          if [ "$SOURCE_DB_URL" = "$TARGET_DB_URL" ]; then
            echo "ERROR: SOURCE_DB_URL và TARGET_DB_URL đang trùng nhau."
            exit 1
          fi

          SRC_REF_URL="$(extract_project_ref "$SOURCE_DB_URL")"
          DST_REF_URL="$(extract_project_ref "$TARGET_DB_URL")"
          if [ -n "$SRC_REF_URL" ] && [ -n "$DST_REF_URL" ] && [ "$SRC_REF_URL" = "$DST_REF_URL" ]; then
            echo "ERROR: SOURCE và TARGET URL cùng project ref ($SRC_REF_URL)."
            exit 1
          fi
          if [ -n "${SOURCE_PROJECT_REF_SECRET:-}" ] && [ -n "$SRC_REF_URL" ] && [ "$SOURCE_PROJECT_REF_SECRET" != "$SRC_REF_URL" ]; then
            echo "ERROR: SOURCE_PROJECT_REF không khớp project ref suy ra từ SOURCE_DB_URL."
            exit 1
          fi
          if [ -n "${TARGET_PROJECT_REF_SECRET:-}" ] && [ -n "$DST_REF_URL" ] && [ "$TARGET_PROJECT_REF_SECRET" != "$DST_REF_URL" ]; then
            echo "ERROR: TARGET_PROJECT_REF không khớp project ref suy ra từ TARGET_DB_URL."
            exit 1
          fi
          SRC_REF="${SOURCE_PROJECT_REF_SECRET:-$SRC_REF_URL}"
          DST_REF="${TARGET_PROJECT_REF_SECRET:-$DST_REF_URL}"
          if [ -n "$SRC_REF" ] && [ -n "$DST_REF" ] && [ "$SRC_REF" = "$DST_REF" ]; then
            echo "ERROR: SOURCE và TARGET có cùng project ref ($SRC_REF)."
            exit 1
          fi

          {
            echo "SOURCE_DB_URL=$SOURCE_DB_URL"
            echo "TARGET_DB_URL=$TARGET_DB_URL"
            echo "STRICT_MODE=$STRICT_MODE"
            echo "SAVE_BACKUP_ARTIFACT=$SAVE_BACKUP_ARTIFACT"
            echo "DEEP_VERIFY_DATA_DUMP=$DEEP_VERIFY_DATA_DUMP"
            echo "PSQL=/usr/lib/postgresql/18/bin/psql"
            echo "PG_DUMP=/usr/lib/postgresql/18/bin/pg_dump"
            echo "PG_RESTORE=/usr/lib/postgresql/18/bin/pg_restore"
            echo "PG_DUMPALL=/usr/lib/postgresql/18/bin/pg_dumpall"
          } >> "$GITHUB_ENV"

          /usr/lib/postgresql/18/bin/psql "$SOURCE_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT 'source_ok';"
          /usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT 'target_ok';"

          SRC_SERVER_FP=$(/usr/lib/postgresql/18/bin/psql "$SOURCE_DB_URL" -X -Atq -F '|' -c \
            "SELECT current_database(),coalesce(inet_server_addr()::text,''),inet_server_port(),pg_postmaster_start_time();")
          DST_SERVER_FP=$(/usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -Atq -F '|' -c \
            "SELECT current_database(),coalesce(inet_server_addr()::text,''),inet_server_port(),pg_postmaster_start_time();")
          if [ "$SRC_SERVER_FP" = "$DST_SERVER_FP" ]; then
            echo "ERROR: SOURCE và TARGET trỏ tới cùng PostgreSQL server/database fingerprint."
            exit 1
          fi

          SRC_VERSION=$(/usr/lib/postgresql/18/bin/psql "$SOURCE_DB_URL" -X -Atqc "SHOW server_version_num;")
          DST_VERSION=$(/usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -Atqc "SHOW server_version_num;")
          SRC_MAJOR=$((SRC_VERSION / 10000))
          DST_MAJOR=$((DST_VERSION / 10000))

          catalog_has_column() {
            local url="$1" rel="$2" col="$3"
            /usr/lib/postgresql/18/bin/psql "$url" -X -Atqc "
              SELECT EXISTS (
                SELECT 1
                FROM pg_attribute
                WHERE attrelid=to_regclass('pg_catalog.' || quote_ident('$rel'))
                  AND attname='$col' AND attnum>0 AND NOT attisdropped
              );"
          }

          db_runtime_properties() {
            local url="$1" locale_expr="''" rules_expr="''"
            if [ "$(catalog_has_column "$url" pg_database datlocale)" = "t" ]; then
              locale_expr="coalesce(d.datlocale,'')"
            elif [ "$(catalog_has_column "$url" pg_database daticulocale)" = "t" ]; then
              locale_expr="coalesce(d.daticulocale,'')"
            fi
            if [ "$(catalog_has_column "$url" pg_database daticurules)" = "t" ]; then
              rules_expr="coalesce(d.daticurules,'')"
            fi
            /usr/lib/postgresql/18/bin/psql "$url" -X -Atq -F '|' -c "
              SELECT pg_get_userbyid(d.datdba),
                     coalesce((SELECT string_agg(aclitem::text, ',' ORDER BY aclitem::text) FROM unnest(d.datacl) AS u(aclitem)),''),
                     pg_encoding_to_char(d.encoding),
                     d.datlocprovider,
                     d.datcollate,
                     d.datctype,
                     ${locale_expr},
                     ${rules_expr},
                     coalesce(d.datcollversion,''),
                     coalesce(pg_database_collation_actual_version(d.oid),''),
                     t.spcname
              FROM pg_database d
              JOIN pg_tablespace t ON t.oid=d.dattablespace
              WHERE d.datname=current_database();"
          }
          SRC_DB_RUNTIME="$(db_runtime_properties "$SOURCE_DB_URL")"
          DST_DB_RUNTIME="$(db_runtime_properties "$TARGET_DB_URL")"

          SRC_DB_BYTES=$(/usr/lib/postgresql/18/bin/psql "$SOURCE_DB_URL" -X -Atqc "SELECT pg_database_size(current_database());")
          RUNNER_FREE_BYTES=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          if [ "$DEEP_VERIFY_DATA_DUMP" = "true" ]; then SPACE_MULTIPLIER=6; else SPACE_MULTIPLIER=4; fi
          REQUIRED_FREE_BYTES=$((SRC_DB_BYTES * SPACE_MULTIPLIER + 2147483648))

          {
            echo "source_server_version_num=$SRC_VERSION"
            echo "target_server_version_num=$DST_VERSION"
            echo "source_db_runtime=$SRC_DB_RUNTIME"
            echo "target_db_runtime=$DST_DB_RUNTIME"
            echo "source_database_size_bytes=$SRC_DB_BYTES"
            echo "runner_free_bytes=$RUNNER_FREE_BYTES"
            echo "required_free_bytes=$REQUIRED_FREE_BYTES"
            echo "source_project_ref=${SRC_REF:-unknown}"
            echo "target_project_ref=${DST_REF:-unknown}"
          } | tee "$REPORT_DIR/preflight.txt"

          if [ "$SRC_MAJOR" -ne "$DST_MAJOR" ]; then
            echo "ERROR: PostgreSQL major version khác nhau: source=$SRC_MAJOR target=$DST_MAJOR" | tee -a "$REPORT_DIR/preflight.txt"
            exit 1
          fi
          if [ "$SRC_MAJOR" -lt 15 ] || [ "$SRC_MAJOR" -gt 18 ]; then
            echo "ERROR: V4 FINAL chỉ cho phép PostgreSQL major 15-18 trong strict clone; major=$SRC_MAJOR chưa nằm trong ma trận catalog đã kiểm chứng." | tee -a "$REPORT_DIR/preflight.txt"
            exit 1
          fi
          if [ "$STRICT_MODE" = "true" ] && [ "$SRC_VERSION" != "$DST_VERSION" ]; then
            echo "ERROR: strict_mode yêu cầu exact server_version_num giống nhau: source=$SRC_VERSION target=$DST_VERSION" | tee -a "$REPORT_DIR/preflight.txt"
            exit 1
          fi
          if [ "$SRC_DB_RUNTIME" != "$DST_DB_RUNTIME" ]; then
            echo "ERROR: Database owner/ACL/encoding/locale/provider/collation-version/default tablespace khác SOURCE." | tee -a "$REPORT_DIR/preflight.txt"
            echo "source=$SRC_DB_RUNTIME" | tee -a "$REPORT_DIR/preflight.txt"
            echo "target=$DST_DB_RUNTIME" | tee -a "$REPORT_DIR/preflight.txt"
            exit 1
          fi
          if [ "$RUNNER_FREE_BYTES" -lt "$REQUIRED_FREE_BYTES" ]; then
            echo "ERROR: Không đủ dung lượng runner cho backup + forensic + deep verification." | tee -a "$REPORT_DIR/preflight.txt"
            exit 1
          fi

          # TSV manifest chỉ an toàn khi identifier được dùng như cột phân cách không chứa TAB/CR/LF.
          # Giá trị tự do hợp lệ (enum label, role setting, row filter...) được hex/hash thay vì cấm.
          count_bad_identifiers() {
            local db_url="$1"
            /usr/lib/postgresql/18/bin/psql "$db_url" -X -Atqc "
              SELECT
                (SELECT count(*) FROM pg_namespace WHERE nspname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_class WHERE relname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_proc WHERE proname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_attribute WHERE attnum>0 AND NOT attisdropped AND attname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_roles WHERE rolname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_constraint WHERE conname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_policy WHERE polname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_publication WHERE pubname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_type WHERE typname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_collation WHERE collname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_event_trigger WHERE evtname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_foreign_server WHERE srvname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_tablespace WHERE spcname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_subscription WHERE subname ~ E'[\t\n\r]') +
                (SELECT count(*) FROM pg_replication_slots WHERE slot_name ~ E'[\t\n\r]');"
          }
          BAD_IDENTIFIERS_SOURCE="$(count_bad_identifiers "$SOURCE_DB_URL")"
          BAD_IDENTIFIERS_TARGET="$(count_bad_identifiers "$TARGET_DB_URL")"
          if [ "$BAD_IDENTIFIERS_SOURCE" -ne 0 ] || [ "$BAD_IDENTIFIERS_TARGET" -ne 0 ]; then
            echo "ERROR: SOURCE/TARGET có identifier chứa TAB/CR/LF; từ chối parser TSV để tránh sai lệch âm thầm."
            exit 1
          fi

          # TARGET phải thật sự sạch về application/custom objects, không chỉ là 'không có table'.
          TARGET_CUSTOM_SCHEMAS=$(/usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -Atqc "
            SELECT count(*) FROM pg_namespace n
            WHERE n.nspname <> 'public'
              AND n.nspname <> 'information_schema'
              AND n.nspname NOT LIKE 'pg_%'
              AND n.nspname NOT IN (
                'auth','storage','realtime','graphql','graphql_public','extensions','pgbouncer',
                'pgsodium','pgsodium_masks','vault','cron','supabase_functions','supabase_migrations',
                'net','_realtime','_analytics'
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_depend d
                WHERE d.classid='pg_namespace'::regclass AND d.objid=n.oid AND d.deptype='e'
              );")

          TARGET_PUBLIC_CUSTOM_OBJECTS=$(/usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -Atqc "
            WITH rels AS (
              SELECT c.oid
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S','f')
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.classid='pg_class'::regclass AND d.objid=c.oid AND d.deptype='e'
                )
            ), funcs AS (
              SELECT p.oid
              FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public'
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.classid='pg_proc'::regclass AND d.objid=p.oid AND d.deptype='e'
                )
            ), types AS (
              SELECT t.oid
              FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace
              WHERE n.nspname='public' AND t.typtype IN ('c','d','e','m','r')
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.classid='pg_type'::regclass AND d.objid=t.oid AND d.deptype='e'
                )
                AND NOT EXISTS (SELECT 1 FROM pg_class c WHERE c.reltype=t.oid)
            )
            SELECT (SELECT count(*) FROM rels)+(SELECT count(*) FROM funcs)+(SELECT count(*) FROM types);")

          safe_count() {
            local table_name="$1"
            local exists
            exists=$(/usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -Atqc "SELECT to_regclass('$table_name') IS NOT NULL;")
            if [ "$exists" = "t" ]; then
              /usr/lib/postgresql/18/bin/psql "$TARGET_DB_URL" -X -Atqc "SELECT count(*) FROM $table_name;"
            else
              printf '0\n'
            fi
          }

          TARGET_AUTH_USERS="$(safe_count auth.users)"
          TARGET_STORAGE_OBJECTS="$(safe_count storage.objects)"
          TARGET_STORAGE_BUCKETS="$(safe_count storage.buckets)"
          TARGET_VAULT_SECRETS="$(safe_count vault.secrets)"
          TARGET_CRON_JOBS="$(safe_count cron.job)"

          {
            echo "target_custom_schemas_before=$TARGET_CUSTOM_SCHEMAS"
            echo "target_public_custom_objects_before=$TARGET_PUBLIC_CUSTOM_OBJECTS"
            echo "target_auth_users_before=$TARGET_AUTH_USERS"
            echo "target_storage_objects_before=$TARGET_STORAGE_OBJECTS"
            echo "target_storage_buckets_before=$TARGET_STORAGE_BUCKETS"
            echo "target_vault_secrets_before=$TARGET_VAULT_SECRETS"
            echo "target_cron_jobs_before=$TARGET_CRON_JOBS"
          } | tee -a "$REPORT_DIR/preflight.txt"

          if [ "$TARGET_CUSTOM_SCHEMAS" -ne 0 ] || [ "$TARGET_PUBLIC_CUSTOM_OBJECTS" -ne 0 ] || \
             [ "$TARGET_AUTH_USERS" -ne 0 ] || [ "$TARGET_STORAGE_OBJECTS" -ne 0 ] || \
             [ "$TARGET_STORAGE_BUCKETS" -ne 0 ] || [ "$TARGET_VAULT_SECRETS" -ne 0 ] || \
             [ "$TARGET_CRON_JOBS" -ne 0 ]; then
            echo "ERROR: TARGET không còn là project sạch. Dừng trước mọi thao tác ghi."
            exit 1
          fi

      - name: Tạo hàm inventory/checksum dùng cho kiểm chứng
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$WORK_DIR/inventory.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          DB_URL="$1"
          OUT_DIR="$2"
          PSQL_BIN="${PSQL:-psql}"
          mkdir -p "$OUT_DIR"

          q() {
            "$PSQL_BIN" "$DB_URL" -X -v ON_ERROR_STOP=1 -Atq -F $'\t' -c "$1"
          }

          SERVER_VERSION_NUM="$(q "SHOW server_version_num;")"
          SERVER_MAJOR=$((SERVER_VERSION_NUM / 10000))
          if [ "$SERVER_MAJOR" -lt 15 ] || [ "$SERVER_MAJOR" -gt 18 ]; then
            echo "ERROR: inventory.sh chỉ hỗ trợ catalog PostgreSQL 15-18; server major=$SERVER_MAJOR" >&2
            exit 1
          fi

          has_catalog_column() {
            local rel="$1" col="$2"
            q "SELECT EXISTS (
                 SELECT 1 FROM pg_attribute
                 WHERE attrelid=to_regclass('pg_catalog.' || quote_ident('$rel'))
                   AND attname='$col' AND attnum>0 AND NOT attisdropped
               );"
          }

          q "SELECT n.nspname, pg_get_userbyid(n.nspowner), coalesce((SELECT string_agg(aclitem::text, ',' ORDER BY aclitem::text) FROM unnest(n.nspacl) AS u(aclitem)),'')
             FROM pg_namespace n
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1;" > "$OUT_DIR/schemas.tsv"

          q "SELECT e.extname, e.extversion, n.nspname
             FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace
             ORDER BY 1;" > "$OUT_DIR/extensions.tsv"

          q "SELECT n.nspname,c.relname,c.relkind,c.relrowsecurity,c.relforcerowsecurity,
                    CASE WHEN c.relkind='m' THEN c.relispopulated::text ELSE '' END,
                    coalesce((SELECT string_agg(aclitem::text, ',' ORDER BY aclitem::text) FROM unnest(c.relacl) AS u(aclitem)),'')
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
               AND c.relkind IN ('r','p','v','m','S','f')
             ORDER BY 1,2,3;" > "$OUT_DIR/relations.tsv"

          DB_LOCALE_EXPR="''"
          DB_RULES_EXPR="''"
          COLL_LOCALE_EXPR="''"
          COLL_RULES_EXPR="''"
          if [ "$(has_catalog_column pg_database datlocale)" = "t" ]; then
            DB_LOCALE_EXPR="coalesce(d.datlocale,'')"
          elif [ "$(has_catalog_column pg_database daticulocale)" = "t" ]; then
            DB_LOCALE_EXPR="coalesce(d.daticulocale,'')"
          fi
          if [ "$(has_catalog_column pg_database daticurules)" = "t" ]; then
            DB_RULES_EXPR="coalesce(d.daticurules,'')"
          fi
          if [ "$(has_catalog_column pg_collation colllocale)" = "t" ]; then
            COLL_LOCALE_EXPR="coalesce(c.colllocale,'')"
          elif [ "$(has_catalog_column pg_collation colliculocale)" = "t" ]; then
            COLL_LOCALE_EXPR="coalesce(c.colliculocale,'')"
          fi
          if [ "$(has_catalog_column pg_collation collicurules)" = "t" ]; then
            COLL_RULES_EXPR="coalesce(c.collicurules,'')"
          fi

          q "SELECT pg_get_userbyid(d.datdba),
                    coalesce((SELECT string_agg(aclitem::text, ',' ORDER BY aclitem::text) FROM unnest(d.datacl) AS u(aclitem)),''),
                    pg_encoding_to_char(d.encoding),d.datlocprovider,d.datcollate,d.datctype,
                    ${DB_LOCALE_EXPR},${DB_RULES_EXPR},coalesce(d.datcollversion,''),
                    coalesce(pg_database_collation_actual_version(d.oid),''),t.spcname
             FROM pg_database d JOIN pg_tablespace t ON t.oid=d.dattablespace
             WHERE d.datname=current_database();" > "$OUT_DIR/database_properties.tsv"

          q "SELECT n.nspname,c.collname,c.collprovider,c.collisdeterministic,c.collencoding,
                    coalesce(c.collcollate,''),coalesce(c.collctype,''),${COLL_LOCALE_EXPR},
                    ${COLL_RULES_EXPR},coalesce(c.collversion,''),coalesce(pg_collation_actual_version(c.oid),'')
             FROM pg_collation c JOIN pg_namespace n ON n.oid=c.collnamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2,5;" > "$OUT_DIR/collations.tsv"

          q "SELECT n.nspname,c.relname,a.attnum,a.attname,
                    format_type(a.atttypid,a.atttypmod),a.attnotnull,
                    md5(coalesce(pg_get_expr(ad.adbin,ad.adrelid),''))
             FROM pg_attribute a
             JOIN pg_class c ON c.oid=a.attrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             LEFT JOIN pg_attrdef ad ON ad.adrelid=a.attrelid AND ad.adnum=a.attnum
             WHERE a.attnum>0 AND NOT a.attisdropped
               AND n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
               AND c.relkind IN ('r','p','v','m','f')
             ORDER BY 1,2,3;" > "$OUT_DIR/columns.tsv"

          q "SELECT n.nspname,c.relname,con.conname,con.contype,
                    md5(pg_get_constraintdef(con.oid,true))
             FROM pg_constraint con
             JOIN pg_class c ON c.oid=con.conrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2,3;" > "$OUT_DIR/constraints.tsv"

          q "SELECT n.nspname,t.relname,i.relname,md5(pg_get_indexdef(i.oid))
             FROM pg_index x
             JOIN pg_class i ON i.oid=x.indexrelid
             JOIN pg_class t ON t.oid=x.indrelid
             JOIN pg_namespace n ON n.oid=t.relnamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2,3;" > "$OUT_DIR/indexes.tsv"

          q "SELECT n.nspname,p.proname,pg_get_function_identity_arguments(p.oid),p.prokind,p.prosecdef,
                    md5(pg_get_functiondef(p.oid)),coalesce((SELECT string_agg(aclitem::text, ',' ORDER BY aclitem::text) FROM unnest(p.proacl) AS u(aclitem)),'')
             FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2,3;" > "$OUT_DIR/functions.tsv"

          q "SELECT n.nspname,c.relname,t.tgname,t.tgenabled,md5(pg_get_triggerdef(t.oid,true))
             FROM pg_trigger t
             JOIN pg_class c ON c.oid=t.tgrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE NOT t.tgisinternal
               AND n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2,3;" > "$OUT_DIR/triggers.tsv"

          q "SELECT schemaname,tablename,policyname,cmd,permissive,
                    md5(coalesce((SELECT string_agg(role_name::text, ',' ORDER BY role_name::text) FROM unnest(roles) AS u(role_name)),'')),
                    md5(coalesce(qual,'')),md5(coalesce(with_check,''))
             FROM pg_policies ORDER BY 1,2,3;" > "$OUT_DIR/policies.tsv"

          q "SELECT p.pubname,pg_get_userbyid(p.pubowner),p.puballtables,p.pubinsert,p.pubupdate,p.pubdelete,p.pubtruncate,p.pubviaroot
             FROM pg_publication p ORDER BY 1;" > "$OUT_DIR/publications.tsv"

          q "SELECT pubname,schemaname,tablename,
                    coalesce(encode(convert_to(array_to_json(attnames)::text,'UTF8'),'hex'),''),
                    encode(convert_to(coalesce(rowfilter,''),'UTF8'),'hex')
             FROM pg_publication_tables ORDER BY 1,2,3;" > "$OUT_DIR/publication_tables.tsv"

          q "SELECT p.pubname,n.nspname,c.relname,
                    CASE WHEN pr.prattrs IS NULL THEN '<ALL>' ELSE
                      encode(convert_to(coalesce((SELECT json_agg(a.attname ORDER BY u.ord)::text
                        FROM unnest(pr.prattrs::smallint[]) WITH ORDINALITY AS u(attnum,ord)
                        JOIN pg_attribute a ON a.attrelid=pr.prrelid AND a.attnum=u.attnum),'[]'),'UTF8'),'hex') END,
                    encode(convert_to(coalesce(pg_get_expr(pr.prqual,pr.prrelid),''),'UTF8'),'hex')
             FROM pg_publication_rel pr
             JOIN pg_publication p ON p.oid=pr.prpubid
             JOIN pg_class c ON c.oid=pr.prrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             ORDER BY 1,2,3;" > "$OUT_DIR/publication_relations.tsv"

          q "SELECT p.pubname,n.nspname
             FROM pg_publication_namespace pn
             JOIN pg_publication p ON p.oid=pn.pnpubid
             JOIN pg_namespace n ON n.oid=pn.pnnspid
             ORDER BY 1,2;" > "$OUT_DIR/publication_schemas.tsv"

          q "SELECT n.nspname,t.typname,e.enumsortorder,encode(convert_to(e.enumlabel,'UTF8'),'hex')
             FROM pg_enum e
             JOIN pg_type t ON t.oid=e.enumtypid
             JOIN pg_namespace n ON n.oid=t.typnamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2,3;" > "$OUT_DIR/enums.tsv"

          q "SELECT n.nspname,c.relname,s.seqstart,s.seqincrement,s.seqmax,s.seqmin,s.seqcache,s.seqcycle
             FROM pg_sequence s
             JOIN pg_class c ON c.oid=s.seqrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2;" > "$OUT_DIR/sequence_defs.tsv"

          q "SELECT rolname,rolsuper,rolinherit,rolcreaterole,rolcreatedb,rolcanlogin,rolreplication,rolbypassrls,rolconnlimit,
                    coalesce(rolvaliduntil::text,''),
                    encode(convert_to(coalesce((SELECT string_agg(setting, E'\n' ORDER BY setting) FROM unnest(rolconfig) AS u(setting)),''),'UTF8'),'hex')
             FROM pg_roles ORDER BY 1;" > "$OUT_DIR/roles.tsv"

          MEMBERSHIP_INHERIT_EXPR="'<N/A>'"
          MEMBERSHIP_SET_EXPR="'<N/A>'"
          if [ "$(has_catalog_column pg_auth_members inherit_option)" = "t" ]; then
            MEMBERSHIP_INHERIT_EXPR="m.inherit_option::text"
          fi
          if [ "$(has_catalog_column pg_auth_members set_option)" = "t" ]; then
            MEMBERSHIP_SET_EXPR="m.set_option::text"
          fi
          q "SELECT member.rolname, role.rolname, grantor.rolname,
                    m.admin_option::text,${MEMBERSHIP_INHERIT_EXPR},${MEMBERSHIP_SET_EXPR}
             FROM pg_auth_members m
             JOIN pg_roles role ON role.oid=m.roleid
             JOIN pg_roles member ON member.oid=m.member
             JOIN pg_roles grantor ON grantor.oid=m.grantor
             ORDER BY 1,2,3,4,5,6;" > "$OUT_DIR/role_memberships.tsv"

          q "SELECT coalesce(r.rolname,'<ALL>'),d.datname,
                    encode(convert_to(coalesce((SELECT string_agg(setting, E'\n' ORDER BY setting) FROM unnest(s.setconfig) AS u(setting)),''),'UTF8'),'hex')
             FROM pg_db_role_setting s
             LEFT JOIN pg_roles r ON r.oid=s.setrole
             LEFT JOIN pg_database d ON d.oid=s.setdatabase
             WHERE s.setdatabase=0 OR d.datname=current_database()
             ORDER BY 1,2,3;" > "$OUT_DIR/db_role_settings.tsv"

          q "SELECT defaclrole::regrole::text,coalesce(n.nspname,'<GLOBAL>'),defaclobjtype,
                    coalesce((SELECT string_agg(aclitem::text, ',' ORDER BY aclitem::text) FROM unnest(defaclacl) AS u(aclitem)),'')
             FROM pg_default_acl d
             LEFT JOIN pg_namespace n ON n.oid=d.defaclnamespace
             ORDER BY 1,2,3;" > "$OUT_DIR/default_acl.tsv"

          q "SELECT e.evtname,e.evtevent,e.evtenabled,n.nspname,p.proname,
                    pg_get_function_identity_arguments(p.oid),coalesce((SELECT string_agg(tag, ',' ORDER BY tag) FROM unnest(e.evttags) AS u(tag)),'')
             FROM pg_event_trigger e
             JOIN pg_proc p ON p.oid=e.evtfoid
             JOIN pg_namespace n ON n.oid=p.pronamespace
             ORDER BY 1;" > "$OUT_DIR/event_triggers.tsv"

          q "SELECT s.srvname,fdw.fdwname,pg_get_userbyid(s.srvowner),md5(coalesce((SELECT string_agg(opt, ',' ORDER BY opt) FROM unnest(s.srvoptions) AS u(opt)),''))
             FROM pg_foreign_server s JOIN pg_foreign_data_wrapper fdw ON fdw.oid=s.srvfdw
             ORDER BY 1;" > "$OUT_DIR/foreign_servers.tsv"

          q "SELECT n.nspname,c.relname,s.srvname
             FROM pg_foreign_table ft
             JOIN pg_class c ON c.oid=ft.ftrelid
             JOIN pg_namespace n ON n.oid=c.relnamespace
             JOIN pg_foreign_server s ON s.oid=ft.ftserver
             ORDER BY 1,2;" > "$OUT_DIR/foreign_tables.tsv"

          q "SELECT s.srvname,coalesce(r.rolname,'PUBLIC'),md5(coalesce((SELECT string_agg(opt, ',' ORDER BY opt) FROM unnest(u.umoptions) AS x(opt)),''))
             FROM pg_user_mapping u
             JOIN pg_foreign_server s ON s.oid=u.umserver
             LEFT JOIN pg_roles r ON r.oid=u.umuser
             ORDER BY 1,2;" > "$OUT_DIR/user_mappings.tsv"

          q "SELECT spcname,pg_get_userbyid(spcowner),coalesce((SELECT string_agg(opt, ',' ORDER BY opt) FROM unnest(spcoptions) AS u(opt)),'')
             FROM pg_tablespace WHERE spcname NOT IN ('pg_default','pg_global') ORDER BY 1;" > "$OUT_DIR/custom_tablespaces.tsv"

          q "SELECT subname,
                    md5((to_jsonb(s) - 'oid' - 'subdbid' - 'subowner' - 'subconninfo')::text),
                    md5(coalesce(subconninfo,''))
             FROM pg_subscription s ORDER BY 1;" > "$OUT_DIR/subscriptions.tsv"

          q "SELECT slot_name,slot_type,plugin,database,temporary
             FROM pg_replication_slots ORDER BY 1;" > "$OUT_DIR/replication_slots.tsv"

          q "SELECT count(DISTINCT loid),count(*),coalesce(sum(octet_length(data)),0),
                    coalesce(sum(hashtextextended(data::text,11)::numeric),0),
                    coalesce(sum(hashtextextended(data::text,37)::numeric),0),
                    coalesce(sum(hashtextextended(data::text,101)::numeric),0),
                    coalesce(min(hashtextextended(data::text,211)),0),
                    coalesce(max(hashtextextended(data::text,401)),0)
             FROM pg_largeobject;" > "$OUT_DIR/large_objects.tsv"

          : > "$OUT_DIR/data_fingerprints.tsv"
          : > "$OUT_DIR/table_counts.tsv"
          q "SELECT n.nspname,c.relname,format('%I.%I',n.nspname,c.relname),c.relkind,c.relispopulated
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE c.relkind IN ('r','m')
               AND n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2;" \
          | while IFS=$'\t' read -r schema_name table_name qualified_name relkind relispopulated; do
              [ -n "$qualified_name" ] || continue
              if [ "$relkind" = "m" ] && [ "$relispopulated" != "t" ]; then
                printf '%s\t%s\tUNPOPULATED\tUNPOPULATED\tUNPOPULATED\tUNPOPULATED\tUNPOPULATED\tUNPOPULATED\n' \
                  "$schema_name" "$table_name" >> "$OUT_DIR/data_fingerprints.tsv"
                continue
              fi
              result=$("$PSQL_BIN" "$DB_URL" -X -v ON_ERROR_STOP=1 -Atq -F $'\t' -c "
                SELECT count(*)::text,
                       coalesce(sum(hashtextextended(to_jsonb(t)::text,0)::numeric),0)::text,
                       coalesce(sum(hashtextextended(to_jsonb(t)::text,17)::numeric),0)::text,
                       coalesce(sum(hashtextextended(to_jsonb(t)::text,97)::numeric),0)::text,
                       coalesce(min(hashtextextended(to_jsonb(t)::text,193)),0)::text,
                       coalesce(max(hashtextextended(to_jsonb(t)::text,389)),0)::text
                FROM ${qualified_name} AS t;")
              printf '%s\t%s\t%s\n' "$schema_name" "$table_name" "$result" >> "$OUT_DIR/data_fingerprints.tsv"
              count_value="${result%%$'\t'*}"
              if [ "$relkind" = "r" ]; then
                printf '%s\t%s\t%s\t%s\n' "$schema_name" "$table_name" "$qualified_name" "$count_value" >> "$OUT_DIR/table_counts.tsv"
              fi
            done

          : > "$OUT_DIR/sequence_values.tsv"
          q "SELECT n.nspname,c.relname,format('%I.%I',n.nspname,c.relname)
             FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE c.relkind='S'
               AND n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%'
             ORDER BY 1,2;" \
          | while IFS=$'\t' read -r schema_name sequence_name qualified_name; do
              result=$("$PSQL_BIN" "$DB_URL" -X -v ON_ERROR_STOP=1 -Atq -F $'\t' -c \
                "SELECT last_value::text,is_called::text FROM ${qualified_name};")
              printf '%s\t%s\t%s\n' "$schema_name" "$sequence_name" "$result" >> "$OUT_DIR/sequence_values.tsv"
            done
          BASH
          chmod +x "$WORK_DIR/inventory.sh"

          cat > "$WORK_DIR/copy_hashes.py" <<'PYHASH'
          #!/usr/bin/env python3
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          if len(sys.argv) != 4:
              raise SystemExit("usage: copy_hashes.py <dump.sql> <out.tsv> <tmpdir>")
          dump_path, out_path, tmp_root = map(Path, sys.argv[1:])
          tmp_root.mkdir(parents=True, exist_ok=True)

          COPY_RE = re.compile(rb'^COPY\s+(.+?)\s+\((.*)\)\s+FROM\s+stdin;$')

          def split_ident_list(raw: bytes, sep: bytes=b','):
              parts=[]; cur=bytearray(); quoted=False; i=0
              while i < len(raw):
                  b=raw[i]
                  if b==34:  # double quote
                      cur.append(b)
                      if quoted and i+1 < len(raw) and raw[i+1]==34:
                          cur.append(34); i+=2; continue
                      quoted=not quoted; i+=1; continue
                  if not quoted and raw[i:i+len(sep)]==sep:
                      parts.append(bytes(cur).strip()); cur.clear(); i+=len(sep); continue
                  cur.append(b); i+=1
              if quoted: raise ValueError('unterminated quoted identifier')
              parts.append(bytes(cur).strip())
              return parts

          def unquote_ident(raw: bytes) -> str:
              raw=raw.strip()
              if len(raw)>=2 and raw[:1]==b'"' and raw[-1:]==b'"':
                  return raw[1:-1].replace(b'""',b'"').decode('utf-8','surrogateescape')
              return raw.decode('utf-8','surrogateescape').lower()

          def parse_header(header: bytes):
              m=COPY_RE.match(header)
              if not m: raise ValueError(f'unsupported COPY header: {header!r}')
              rel_raw, cols_raw=m.groups()
              rel_parts=split_ident_list(rel_raw, b'.')
              if len(rel_parts) not in (1,2): raise ValueError('unexpected relation qualification')
              relation=[unquote_ident(x) for x in rel_parts]
              columns=[unquote_ident(x) for x in split_ident_list(cols_raw)]
              canonical=json.dumps({'relation':relation,'columns':columns},ensure_ascii=False,separators=(',',':')).encode('utf-8','surrogateescape')
              return canonical

          blocks={}
          current=None
          handle=None
          try:
              with dump_path.open('rb') as f:
                  for line in f:
                      if current is None:
                          if line.startswith(b'COPY ') and line.rstrip(b'\r\n').endswith(b' FROM stdin;'):
                              header=line.rstrip(b'\r\n')
                              canonical=parse_header(header)
                              key=hashlib.sha256(canonical).hexdigest()
                              if key in blocks:
                                  raise SystemExit(f'duplicate COPY target/columns in dump: {canonical!r}')
                              p=tmp_root/key
                              blocks[key]={'canonical':canonical,'path':p,'rows':0}
                              current=key
                              handle=p.open('wb')
                          continue
                      if line.rstrip(b'\r\n')==b'\\.':
                          assert handle is not None
                          handle.close(); handle=None; current=None
                          continue
                      assert handle is not None
                      handle.write(line); blocks[current]['rows']+=1
              if current is not None:
                  raise SystemExit('unterminated COPY block')
          finally:
              if handle is not None: handle.close()

          env=dict(os.environ); env['LC_ALL']='C'; env['TMPDIR']=str(tmp_root)
          results=[]
          for key,meta in blocks.items():
              digest=hashlib.sha256(); digest.update(meta['canonical']+b'\n')
              proc=subprocess.Popen(['sort',str(meta['path'])],stdout=subprocess.PIPE,env=env)
              assert proc.stdout is not None
              for chunk in iter(lambda: proc.stdout.read(1024*1024),b''): digest.update(chunk)
              rc=proc.wait()
              if rc!=0: raise SystemExit(f'sort failed for COPY block {key}: rc={rc}')
              canonical_text=meta['canonical'].decode('utf-8','surrogateescape')
              if any(x in canonical_text for x in ('\t','\n','\r')): raise SystemExit('unsafe canonical COPY metadata')
              results.append((key,meta['rows'],digest.hexdigest(),canonical_text))
              meta['path'].unlink(missing_ok=True)
          results.sort(key=lambda x:x[0])
          with out_path.open('w',encoding='utf-8',newline='\n') as o:
              for key,count,digest,canonical_text in results:
                  o.write(f'{key}\t{count}\t{digest}\t{canonical_text}\n')
          PYHASH
          chmod +x "$WORK_DIR/copy_hashes.py"

          cat > "$WORK_DIR/build_precommit_guard.py" <<'PYGUARD'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          if len(sys.argv) != 5:
              raise SystemExit("usage: build_precommit_guard.py <data_fingerprints.tsv> <sequence_values.tsv> <large_objects.tsv> <out.sql>")
          data_path, seq_path, lo_path, out_path = map(Path, sys.argv[1:])

          SKIP_DATA = {
              ('auth','schema_migrations'),
              ('storage','migrations'),
              ('realtime','schema_migrations'),
              ('supabase_functions','migrations'),
          }

          def qi(s: str) -> str:
              return '"' + s.replace('"','""') + '"'

          def ql(s: str) -> str:
              return "'" + s.replace("'","''") + "'"

          chunks = ["-- Generated pre-commit verification. Any mismatch raises and rolls back the single restore transaction.\n"]
          for lineno, line in enumerate(data_path.read_text(encoding='utf-8').splitlines(),1):
              if not line: continue
              f=line.split('\t')
              if len(f)!=8: raise SystemExit(f'bad data fingerprint line {lineno}: expected 8 fields, got {len(f)}')
              schema, table, count, h0, h17, h97, hmin, hmax=f
              if (schema,table) in SKIP_DATA: continue
              if count=='UNPOPULATED':
                  label=f'{schema}.{table}'
                  chunks.append(f"""DO $guard$\nDECLARE k \"char\"; p boolean;\nBEGIN\n  SELECT c.relkind,c.relispopulated INTO k,p\n  FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace\n  WHERE n.nspname={ql(schema)} AND c.relname={ql(table)};\n  IF k IS DISTINCT FROM 'm' OR p IS DISTINCT FROM false THEN\n    RAISE EXCEPTION 'precommit unpopulated materialized view mismatch: %', {ql(label)};\n  END IF;\nEND $guard$;\n""")
                  continue
              expected=[count,h0,h17,h97,hmin,hmax]
              if any(not x or any(c not in '-0123456789' for c in x) for x in expected):
                  raise SystemExit(f'unsafe numeric fingerprint at line {lineno}')
              rel=f'{qi(schema)}.{qi(table)}'
              label=f'{schema}.{table}'
              chunks.append(f"""DO $guard$\nDECLARE got text[];\nBEGIN\n  SELECT ARRAY[\n    count(*)::text,\n    coalesce(sum(hashtextextended(to_jsonb(t)::text,0)::numeric),0)::text,\n    coalesce(sum(hashtextextended(to_jsonb(t)::text,17)::numeric),0)::text,\n    coalesce(sum(hashtextextended(to_jsonb(t)::text,97)::numeric),0)::text,\n    coalesce(min(hashtextextended(to_jsonb(t)::text,193)),0)::text,\n    coalesce(max(hashtextextended(to_jsonb(t)::text,389)),0)::text\n  ] INTO got FROM {rel} AS t;\n  IF got IS DISTINCT FROM ARRAY[{','.join(ql(x) for x in expected)}]::text[] THEN\n    RAISE EXCEPTION 'precommit data fingerprint mismatch: %', {ql(label)};\n  END IF;\nEND $guard$;\n""")

          for lineno, line in enumerate(seq_path.read_text(encoding='utf-8').splitlines(),1):
              if not line: continue
              f=line.split('\t')
              if len(f)!=4: raise SystemExit(f'bad sequence line {lineno}: expected 4 fields, got {len(f)}')
              schema, seq, last_value, is_called=f
              if not last_value or any(c not in '-0123456789' for c in last_value): raise SystemExit(f'unsafe sequence value line {lineno}')
              if is_called not in ('t','f'): raise SystemExit(f'unsafe is_called line {lineno}')
              rel=f'{qi(schema)}.{qi(seq)}'; label=f'{schema}.{seq}'
              chunks.append(f"""DO $guard$\nDECLARE v text; c text;\nBEGIN\n  SELECT last_value::text,is_called::text INTO v,c FROM {rel};\n  IF v IS DISTINCT FROM {ql(last_value)} OR c IS DISTINCT FROM {ql(is_called)} THEN\n    RAISE EXCEPTION 'precommit sequence mismatch: %', {ql(label)};\n  END IF;\nEND $guard$;\n""")

          lo_lines=[x for x in lo_path.read_text(encoding='utf-8').splitlines() if x]
          if len(lo_lines)!=1: raise SystemExit('large_objects.tsv must contain exactly one row')
          lo=lo_lines[0].split('\t')
          if len(lo)!=8: raise SystemExit(f'large_objects.tsv expected 8 fields, got {len(lo)}')
          if any(not x or any(c not in '-0123456789' for c in x) for x in lo): raise SystemExit('unsafe large object fingerprint')
          chunks.append(f"""DO $guard$\nDECLARE got text[];\nBEGIN\n  SELECT ARRAY[\n    count(DISTINCT loid)::text,count(*)::text,coalesce(sum(octet_length(data)),0)::text,\n    coalesce(sum(hashtextextended(data::text,11)::numeric),0)::text,\n    coalesce(sum(hashtextextended(data::text,37)::numeric),0)::text,\n    coalesce(sum(hashtextextended(data::text,101)::numeric),0)::text,\n    coalesce(min(hashtextextended(data::text,211)),0)::text,\n    coalesce(max(hashtextextended(data::text,401)),0)::text\n  ] INTO got FROM pg_largeobject;\n  IF got IS DISTINCT FROM ARRAY[{','.join(ql(x) for x in lo)}]::text[] THEN\n    RAISE EXCEPTION 'precommit large-object fingerprint mismatch';\n  END IF;\nEND $guard$;\n""")

          out_path.write_text('\n'.join(chunks),encoding='utf-8',newline='\n')
          PYGUARD
          chmod +x "$WORK_DIR/build_precommit_guard.py"

      - name: Chụp inventory nguồn trước backup
        shell: bash
        run: |
          set -Eeuo pipefail
          "$WORK_DIR/inventory.sh" "$SOURCE_DB_URL" "$REPORT_DIR/source_before"
          $PG_DUMP "$SOURCE_DB_URL" --schema-only \
            | sed -E '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^\\(un)?restrict /d' \
            > "$REPORT_DIR/source_schema_before.sql"

      - name: Preflight Vault/pgsodium root encryption key - chỉ đọc, chưa thay đổi TARGET
        shell: bash
        env:
          COPY_VAULT_ROOT_KEY: ${{ github.event_name == 'push' && 'true' || inputs.copy_vault_root_key }}
          SOURCE_PROJECT_REF: ${{ secrets.SOURCE_PROJECT_REF }}
          TARGET_PROJECT_REF: ${{ secrets.TARGET_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail

          HAS_VAULT=0
          if $PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT to_regclass('vault.secrets') IS NOT NULL;" | grep -qx t; then
            VAULT_ROWS=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT count(*) FROM vault.secrets;")
            [ "$VAULT_ROWS" -gt 0 ] && HAS_VAULT=1
          fi
          if $PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname='pgsodium');" | grep -qx t; then
            HAS_VAULT=1
          fi

          echo "source_has_vault_or_pgsodium=$HAS_VAULT" >> "$REPORT_DIR/preflight.txt"
          echo "VAULT_KEY_REQUIRED=$HAS_VAULT" >> "$GITHUB_ENV"

          if [ "$HAS_VAULT" != "1" ]; then
            echo "Vault/pgsodium: không phát hiện nhu cầu root key."
            exit 0
          fi

          if [ "$COPY_VAULT_ROOT_KEY" != "true" ]; then
            echo "ERROR: Source dùng Vault/pgsodium nhưng copy_vault_root_key=false."
            exit 1
          fi

          if [ -z "${SOURCE_PROJECT_REF:-}" ] || [ -z "${TARGET_PROJECT_REF:-}" ] || [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: Cần SOURCE_PROJECT_REF, TARGET_PROJECT_REF và SUPABASE_ACCESS_TOKEN để di chuyển root encryption key."
            exit 1
          fi

          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          SRC_KEY_FILE="$RUNNER_TEMP/source-root-key.json"
          DST_KEY_FILE="$RUNNER_TEMP/target-root-key-original.json"
          umask 077

          HTTP_GET_SRC=$(curl -sS -o "$SRC_KEY_FILE" -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${SOURCE_PROJECT_REF}/pgsodium" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          HTTP_GET_DST=$(curl -sS -o "$DST_KEY_FILE" -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/pgsodium" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")

          if [ "$HTTP_GET_SRC" -lt 200 ] || [ "$HTTP_GET_SRC" -ge 300 ] || \
             [ "$HTTP_GET_DST" -lt 200 ] || [ "$HTTP_GET_DST" -ge 300 ]; then
            rm -f "$SRC_KEY_FILE" "$DST_KEY_FILE"
            echo "ERROR: Không đọc được root encryption key source/target qua Management API."
            exit 1
          fi

          jq -e 'type == "object"' "$SRC_KEY_FILE" >/dev/null
          jq -e 'type == "object"' "$DST_KEY_FILE" >/dev/null
          echo "Vault root key preflight: PASSED (chưa ghi TARGET)" | tee -a "$REPORT_DIR/preflight.txt"

      - name: Backup logic chính thức + snapshot witness forensic + canonical COPY hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          CLI_DIR="$RUNNER_TEMP/supabase-cli-isolated"
          mkdir -p "$CLI_DIR"

          # Snapshot witness là một snapshot transaction nhất quán; official split dump phải chứng minh data khớp witness này.
          $PG_DUMP "$SOURCE_DB_URL" \
            --format=custom --create --large-objects --serializable-deferrable --verbose \
            --file="$BACKUP_DIR/full_database_forensic.dump" \
            2> "$REPORT_DIR/full_dump.log"
          $PG_RESTORE --data-only --file="$BACKUP_DIR/forensic_data.sql" "$BACKUP_DIR/full_database_forensic.dump"
          python3 "$WORK_DIR/copy_hashes.py" "$BACKUP_DIR/forensic_data.sql" \
            "$REPORT_DIR/forensic_copy_hashes.tsv" "$RUNNER_TEMP/copyhash-forensic"

          # Chạy CLI trong thư mục cô lập để config.toml cũ của repository không ảnh hưởng hành vi CLI v3.
          (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$BACKUP_DIR/roles.sql" --role-only --remote="$SOURCE_DB_URL")
          (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$BACKUP_DIR/schema.sql" --remote="$SOURCE_DB_URL")
          (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$BACKUP_DIR/data.sql" --data-only --use-copy \
            -x storage.buckets_vectors -x storage.vector_indexes --remote="$SOURCE_DB_URL")

          if $PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT to_regnamespace('supabase_migrations') IS NOT NULL;" | grep -qx t; then
            (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$BACKUP_DIR/migration_history_schema.sql" \
              --schema supabase_migrations --remote="$SOURCE_DB_URL")
            (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$BACKUP_DIR/migration_history_data.sql" \
              --schema supabase_migrations --data-only --use-copy --remote="$SOURCE_DB_URL")
          else
            : > "$BACKUP_DIR/migration_history_schema.sql"
            : > "$BACKUP_DIR/migration_history_data.sql"
          fi
          python3 "$WORK_DIR/copy_hashes.py" "$BACKUP_DIR/data.sql" \
            "$REPORT_DIR/official_copy_hashes.tsv" "$RUNNER_TEMP/copyhash-official"
          if [ -s "$BACKUP_DIR/migration_history_data.sql" ]; then
            python3 "$WORK_DIR/copy_hashes.py" "$BACKUP_DIR/migration_history_data.sql" \
              "$REPORT_DIR/migration_history_copy_hashes.tsv" "$RUNNER_TEMP/copyhash-migrations"
          else
            : > "$REPORT_DIR/migration_history_copy_hashes.tsv"
          fi

          MANAGED=()
          for sm in auth storage realtime cron vault net supabase_functions supabase_migrations; do
            if $PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT to_regnamespace('$sm') IS NOT NULL;" | grep -qx t; then
              MANAGED+=("--schema=$sm")
            fi
          done
          if [ "${#MANAGED[@]}" -gt 0 ]; then
            $PG_DUMP "$SOURCE_DB_URL" --schema-only --no-owner --no-privileges "${MANAGED[@]}" \
              > "$BACKUP_DIR/managed_schemas_forensic.sql"
          else
            : > "$BACKUP_DIR/managed_schemas_forensic.sql"
          fi

          sha256sum "$BACKUP_DIR"/* > "$REPORT_DIR/backup_sha256.txt"
          $PG_DUMP "$SOURCE_DB_URL" --schema-only \
            | sed -E '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^\\(un)?restrict /d' \
            > "$REPORT_DIR/source_schema_after_dump.sql"
          sha256sum "$REPORT_DIR/official_copy_hashes.tsv" "$REPORT_DIR/migration_history_copy_hashes.tsv" \
                    "$REPORT_DIR/forensic_copy_hashes.tsv" \
            > "$REPORT_DIR/copy_hash_manifest_sha256.txt"

      - name: Kiểm tra SOURCE có thay đổi trong toàn bộ thời gian backup hay không
        shell: bash
        run: |
          set -Eeuo pipefail
          "$WORK_DIR/inventory.sh" "$SOURCE_DB_URL" "$REPORT_DIR/source_after_backup"

          STABLE_FILES=(
            schemas.tsv extensions.tsv database_properties.tsv collations.tsv relations.tsv columns.tsv constraints.tsv indexes.tsv
            functions.tsv triggers.tsv policies.tsv publications.tsv publication_tables.tsv publication_relations.tsv publication_schemas.tsv
            enums.tsv sequence_defs.tsv sequence_values.tsv
            roles.tsv role_memberships.tsv db_role_settings.tsv default_acl.tsv event_triggers.tsv
            foreign_servers.tsv foreign_tables.tsv user_mappings.tsv custom_tablespaces.tsv
            large_objects.tsv subscriptions.tsv replication_slots.tsv
          )

          FAILED=0
          : > "$REPORT_DIR/source_stability_summary.txt"
          for f in "${STABLE_FILES[@]}"; do
            if diff -u "$REPORT_DIR/source_before/$f" "$REPORT_DIR/source_after_backup/$f" \
              > "$REPORT_DIR/source_changed_${f%.tsv}.diff"; then
              echo "PASS $f" >> "$REPORT_DIR/source_stability_summary.txt"
              rm -f "$REPORT_DIR/source_changed_${f%.tsv}.diff"
            else
              echo "FAIL $f" >> "$REPORT_DIR/source_stability_summary.txt"
              FAILED=1
            fi
          done

          filter_clone_data() {
            grep -Ev $'^(auth\tschema_migrations\t|storage\tmigrations\t|realtime\tschema_migrations\t|supabase_functions\tmigrations\t)' "$1" || true
          }
          filter_clone_data "$REPORT_DIR/source_before/data_fingerprints.tsv" > "$RUNNER_TEMP/source_before_clone_data.tsv"
          filter_clone_data "$REPORT_DIR/source_after_backup/data_fingerprints.tsv" > "$RUNNER_TEMP/source_after_clone_data.tsv"
          if diff -u "$RUNNER_TEMP/source_before_clone_data.tsv" "$RUNNER_TEMP/source_after_clone_data.tsv" \
            > "$REPORT_DIR/source_changed_clone_data.diff"; then
            echo "PASS clone_data_fingerprints" >> "$REPORT_DIR/source_stability_summary.txt"
            rm -f "$REPORT_DIR/source_changed_clone_data.diff"
          else
            echo "FAIL clone_data_fingerprints" >> "$REPORT_DIR/source_stability_summary.txt"
            FAILED=1
          fi

          if diff -u "$REPORT_DIR/source_schema_before.sql" "$REPORT_DIR/source_schema_after_dump.sql" \
            > "$REPORT_DIR/source_changed_schema.diff"; then
            echo "PASS schema_canonical" >> "$REPORT_DIR/source_stability_summary.txt"
            rm -f "$REPORT_DIR/source_changed_schema.diff"
          else
            echo "FAIL schema_canonical" >> "$REPORT_DIR/source_stability_summary.txt"
            FAILED=1
          fi

          # Dump lại đúng công cụ restore để chứng minh schema/roles restore files không bắt trúng trạng thái thoáng qua.
          CLI_DIR="$RUNNER_TEMP/supabase-cli-isolated"
          mkdir -p "$CLI_DIR"
          (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$REPORT_DIR/schema_probe.sql" --remote="$SOURCE_DB_URL")
          (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$REPORT_DIR/roles_probe.sql" --role-only --remote="$SOURCE_DB_URL")
          normalize_dump_sql() {
            sed -E '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^\\(un)?restrict /d' "$1"
          }
          normalize_dump_sql "$BACKUP_DIR/schema.sql" > "$RUNNER_TEMP/schema_restore.normalized.sql"
          normalize_dump_sql "$REPORT_DIR/schema_probe.sql" > "$RUNNER_TEMP/schema_probe.normalized.sql"
          if diff -u "$RUNNER_TEMP/schema_restore.normalized.sql" "$RUNNER_TEMP/schema_probe.normalized.sql" \
            > "$REPORT_DIR/source_changed_official_schema_dump.diff"; then
            echo "PASS official_schema_dump_repeat" >> "$REPORT_DIR/source_stability_summary.txt"
            rm -f "$REPORT_DIR/source_changed_official_schema_dump.diff"
          else
            echo "FAIL official_schema_dump_repeat" >> "$REPORT_DIR/source_stability_summary.txt"
            FAILED=1
          fi
          normalize_dump_sql "$BACKUP_DIR/roles.sql" > "$RUNNER_TEMP/roles_restore.normalized.sql"
          normalize_dump_sql "$REPORT_DIR/roles_probe.sql" > "$RUNNER_TEMP/roles_probe.normalized.sql"
          if diff -u "$RUNNER_TEMP/roles_restore.normalized.sql" "$RUNNER_TEMP/roles_probe.normalized.sql" \
            > "$REPORT_DIR/source_changed_official_roles_dump.diff"; then
            echo "PASS official_roles_dump_repeat" >> "$REPORT_DIR/source_stability_summary.txt"
            rm -f "$REPORT_DIR/source_changed_official_roles_dump.diff"
          else
            echo "FAIL official_roles_dump_repeat" >> "$REPORT_DIR/source_stability_summary.txt"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "WARNING: SOURCE thay đổi trong thời gian backup; không thể chứng minh snapshot logic đồng nhất."
            cat "$REPORT_DIR/source_stability_summary.txt"
            if [ "$STRICT_MODE" = "true" ]; then
              exit 1
            fi
          else
            echo "SOURCE STABILITY CHECK: PASSED"
          fi

          # Recheck free disk after all backup products exist; never start restore with low headroom.
          SRC_DB_BYTES_NOW=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT pg_database_size(current_database());")
          RUNNER_FREE_AFTER_BACKUP=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          MIN_RESTORE_HEADROOM=$((SRC_DB_BYTES_NOW * 2 + 1073741824))
          echo "source_database_size_after_backup_bytes=$SRC_DB_BYTES_NOW" | tee -a "$REPORT_DIR/preflight.txt"
          echo "runner_free_after_backup=$RUNNER_FREE_AFTER_BACKUP" | tee -a "$REPORT_DIR/preflight.txt"
          echo "min_restore_headroom=$MIN_RESTORE_HEADROOM" | tee -a "$REPORT_DIR/preflight.txt"
          if [ "$RUNNER_FREE_AFTER_BACKUP" -lt "$MIN_RESTORE_HEADROOM" ]; then
            echo "ERROR: Không đủ headroom sau backup để restore + verify an toàn." | tee -a "$REPORT_DIR/preflight.txt"
            exit 1
          fi

      - name: Hard gate độ phủ dữ liệu và thành phần không portable
        shell: bash
        run: |
          set -Eeuo pipefail
          "$WORK_DIR/inventory.sh" "$TARGET_DB_URL" "$REPORT_DIR/target_before"
          FAILED=0
          : > "$REPORT_DIR/nonportable.txt"

          # 1) Bảo đảm mọi base-table có dữ liệu đều thực sự xuất hiện trong official data.sql.
          # supabase_migrations được dump riêng; materialized views được kiểm chứng sau restore.
          : > "$REPORT_DIR/nonempty_tables_missing_from_data_dump.tsv"
          while IFS=$'\t' read -r s t qualified cnt; do
            [ -n "$s" ] || continue
            [ "$cnt" -gt 0 ] || continue
            [ "$s" = "supabase_migrations" ] && continue
            case "$s.$t" in
              auth.schema_migrations|storage.migrations|realtime.schema_migrations|supabase_functions.migrations) continue ;;
            esac
            if ! grep -Fq "COPY ${qualified} (" "$BACKUP_DIR/data.sql"; then
              printf '%s\t%s\t%s\n' "$s" "$t" "$cnt" >> "$REPORT_DIR/nonempty_tables_missing_from_data_dump.tsv"
            fi
          done < "$REPORT_DIR/source_after_backup/table_counts.tsv"

          if [ -s "$REPORT_DIR/nonempty_tables_missing_from_data_dump.tsv" ]; then
            echo "WARNING: Có bảng nguồn có dữ liệu nhưng không xuất hiện trong official data.sql:" | tee -a "$REPORT_DIR/nonportable.txt"
            cat "$REPORT_DIR/nonempty_tables_missing_from_data_dump.tsv" | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          # 2) Official data.sql phải trùng snapshot witness forensic theo từng COPY block, không phụ thuộc thứ tự dòng.
          awk -F '\t' 'NR==FNR{want[$1]=1; next} ($1 in want)' \
            "$REPORT_DIR/official_copy_hashes.tsv" "$REPORT_DIR/forensic_copy_hashes.tsv" \
            | sort -t $'\t' -k1,1 > "$RUNNER_TEMP/forensic_official_subset.tsv"
          sort -t $'\t' -k1,1 "$REPORT_DIR/official_copy_hashes.tsv" > "$RUNNER_TEMP/official_copy_hashes.sorted.tsv"
          if ! diff -u "$RUNNER_TEMP/official_copy_hashes.sorted.tsv" "$RUNNER_TEMP/forensic_official_subset.tsv" \
            > "$REPORT_DIR/official_vs_forensic_snapshot.diff"; then
            echo "WARNING: official data.sql không trùng snapshot witness forensic; không thể chứng minh split dump cùng snapshot." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          else
            rm -f "$REPORT_DIR/official_vs_forensic_snapshot.diff"
            echo "snapshot_witness_copy_hashes=PASS" >> "$REPORT_DIR/nonportable.txt"
          fi

          # Migration history được dump riêng cũng phải trùng snapshot witness forensic.
          if [ -s "$REPORT_DIR/migration_history_copy_hashes.tsv" ]; then
            awk -F '	' 'NR==FNR{want[$1]=1; next} ($1 in want)' \
              "$REPORT_DIR/migration_history_copy_hashes.tsv" "$REPORT_DIR/forensic_copy_hashes.tsv" \
              | sort -t $'	' -k1,1 > "$RUNNER_TEMP/forensic_migration_subset.tsv"
            sort -t $'	' -k1,1 "$REPORT_DIR/migration_history_copy_hashes.tsv" > "$RUNNER_TEMP/migration_copy_hashes.sorted.tsv"
            if ! diff -u "$RUNNER_TEMP/migration_copy_hashes.sorted.tsv" "$RUNNER_TEMP/forensic_migration_subset.tsv" \
              > "$REPORT_DIR/migrations_vs_forensic_snapshot.diff"; then
              echo "WARNING: migration history dump không trùng snapshot witness forensic." | tee -a "$REPORT_DIR/nonportable.txt"
              FAILED=1
            else
              rm -f "$REPORT_DIR/migrations_vs_forensic_snapshot.diff"
              echo "snapshot_witness_migration_history=PASS" >> "$REPORT_DIR/nonportable.txt"
            fi
          fi

          # 3) Hai bảng vector-storage được Supabase docs chủ động loại khỏi logical data dump.
          for t in storage.buckets_vectors storage.vector_indexes; do
            EXISTS=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT to_regclass('$t') IS NOT NULL;")
            if [ "$EXISTS" = "t" ]; then
              CNT=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT count(*) FROM $t;")
              if [ "$CNT" -gt 0 ]; then
                echo "WARNING: $t có $CNT dòng nhưng bị loại khỏi logical data dump." | tee -a "$REPORT_DIR/nonportable.txt"
                FAILED=1
              fi
            fi
          done

          # 4) Subscription/slot/FDW/tablespace là cluster/external state, không clone an toàn bằng logical restore hosted.
          if [ -s "$REPORT_DIR/source_after_backup/subscriptions.tsv" ]; then
            echo "WARNING: SOURCE có PostgreSQL subscription." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi
          if awk -F '\t' '$1 !~ /^supabase_realtime/ && $1 != "" {found=1} END{exit !found}' \
            "$REPORT_DIR/source_after_backup/replication_slots.tsv"; then
            echo "WARNING: SOURCE có custom replication slot ngoài Supabase Realtime." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi
          if [ -s "$REPORT_DIR/source_after_backup/foreign_servers.tsv" ] || \
             [ -s "$REPORT_DIR/source_after_backup/foreign_tables.tsv" ] || \
             [ -s "$REPORT_DIR/source_after_backup/user_mappings.tsv" ]; then
            echo "WARNING: SOURCE có FDW/foreign table/user mapping; external state/credential không thể chứng minh clone 100%." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi
          if [ -s "$REPORT_DIR/source_after_backup/custom_tablespaces.tsv" ]; then
            echo "WARNING: SOURCE có custom tablespace." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          # TARGET mới/sạch cũng không được chứa external/cluster state riêng.
          if [ -s "$REPORT_DIR/target_before/subscriptions.tsv" ]; then
            echo "WARNING: TARGET có PostgreSQL subscription; TARGET không sạch." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi
          if awk -F '	' '$1 !~ /^supabase_realtime/ && $1 != "" {found=1} END{exit !found}' \
            "$REPORT_DIR/target_before/replication_slots.tsv"; then
            echo "WARNING: TARGET có custom replication slot ngoài Supabase Realtime." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi
          if [ -s "$REPORT_DIR/target_before/foreign_servers.tsv" ] || \
             [ -s "$REPORT_DIR/target_before/foreign_tables.tsv" ] || \
             [ -s "$REPORT_DIR/target_before/user_mappings.tsv" ] || \
             [ -s "$REPORT_DIR/target_before/custom_tablespaces.tsv" ]; then
            echo "WARNING: TARGET có FDW/foreign mapping/custom tablespace; TARGET không sạch." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          # 5) Chỉ publication supabase_realtime được workflow đồng bộ an toàn.
          if awk -F '\t' '$1 != "supabase_realtime" && $1 != "" {found=1} END{exit !found}' \
            "$REPORT_DIR/source_after_backup/publications.tsv"; then
            echo "WARNING: SOURCE có custom publication ngoài supabase_realtime." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          if awk -F '	' '$1 != "supabase_realtime" && $1 != "" {found=1} END{exit !found}' \
            "$REPORT_DIR/target_before/publications.tsv"; then
            echo "WARNING: TARGET có custom publication ngoài supabase_realtime; TARGET không sạch." | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          # 6) Custom LOGIN role: password hash không nằm trong logical dump nên strict clone phải từ chối.
          cut -f1 "$REPORT_DIR/target_before/roles.tsv" | sort -u > "$RUNNER_TEMP/target_roles_before.txt"
          cut -f1 "$REPORT_DIR/source_after_backup/roles.tsv" | sort -u > "$RUNNER_TEMP/source_roles.txt"
          awk -F '	' '$6=="t" {print $1}' "$REPORT_DIR/source_after_backup/roles.tsv" | sort -u \
            > "$RUNNER_TEMP/source_login_roles.txt"
          grep -Ev '^(postgres|authenticator|dashboard_user|pgbouncer|cli_login_postgres|anon|authenticated|service_role|pg_.*|supabase_.*)$' \
            "$RUNNER_TEMP/source_login_roles.txt" > "$REPORT_DIR/custom_login_roles_unportable.txt" || true
          if [ -s "$REPORT_DIR/custom_login_roles_unportable.txt" ]; then
            echo "WARNING: SOURCE có custom LOGIN role; password không thể sao chép/xác minh bằng logical dump:" | tee -a "$REPORT_DIR/nonportable.txt"
            cat "$REPORT_DIR/custom_login_roles_unportable.txt" | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          # TARGET sạch không được có role lạ chỉ tồn tại ở TARGET (ngoài role platform/predefined).
          comm -13 "$RUNNER_TEMP/source_roles.txt" "$RUNNER_TEMP/target_roles_before.txt" \
            | grep -Ev '^(postgres|authenticator|dashboard_user|pgbouncer|cli_login_postgres|anon|authenticated|service_role|pg_.*|supabase_.*)$' \
            > "$REPORT_DIR/target_only_custom_roles.txt" || true
          if [ -s "$REPORT_DIR/target_only_custom_roles.txt" ]; then
            echo "WARNING: TARGET có custom role không tồn tại ở SOURCE; TARGET không đủ sạch:" | tee -a "$REPORT_DIR/nonportable.txt"
            cat "$REPORT_DIR/target_only_custom_roles.txt" | tee -a "$REPORT_DIR/nonportable.txt"
            FAILED=1
          fi

          # TARGET không được có DB-role setting/default ACL/event trigger riêng mà SOURCE không có.
          for f in db_role_settings.tsv default_acl.tsv event_triggers.tsv; do
            comm -13 <(sort "$REPORT_DIR/source_after_backup/$f") <(sort "$REPORT_DIR/target_before/$f") \
              > "$REPORT_DIR/target_only_${f%.tsv}.txt" || true
            if [ -s "$REPORT_DIR/target_only_${f%.tsv}.txt" ]; then
              echo "WARNING: TARGET có state thừa không có ở SOURCE: $f" | tee -a "$REPORT_DIR/nonportable.txt"
              cat "$REPORT_DIR/target_only_${f%.tsv}.txt" | tee -a "$REPORT_DIR/nonportable.txt"
              FAILED=1
            fi
          done

          # Danh sách custom role source-only cần phải xuất hiện sau restore.
          comm -23 "$RUNNER_TEMP/source_roles.txt" "$RUNNER_TEMP/target_roles_before.txt" \
            > "$REPORT_DIR/source_only_roles.txt" || true

          # 7) Storage blobs nằm ngoài PostgreSQL: cảnh báo rõ, không coi là lỗi DB logical clone.
          if $PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT to_regclass('storage.objects') IS NOT NULL;" | grep -qx t; then
            STORAGE_OBJECTS=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT count(*) FROM storage.objects;")
          else
            STORAGE_OBJECTS=0
          fi
          echo "storage_object_metadata_rows=$STORAGE_OBJECTS" >> "$REPORT_DIR/nonportable.txt"
          if [ "$STORAGE_OBJECTS" -gt 0 ]; then
            echo "NOTICE: metadata storage.objects được kiểm chứng trong DB; file blob vật lý nằm ngoài PostgreSQL và không thuộc workflow DB clone." | tee -a "$REPORT_DIR/nonportable.txt"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Có thành phần logical clone không thể chứng minh đầy đủ/an toàn."
            echo "       Dùng Supabase Restore to a New Project nếu cần clone vật lý gần tuyệt đối."
            exit 1
          fi

      - name: Hard gate tương thích managed schemas và extension trước khi ghi TARGET
        shell: bash
        run: |
          set -Eeuo pipefail

          # Extension phải tồn tại sẵn ở target với đúng version + schema.
          # Không tự CREATE EXTENSION trước hard-gate để bảo đảm chưa thay đổi TARGET nếu không tương thích.
          if ! diff -u "$REPORT_DIR/source_after_backup/extensions.tsv" "$REPORT_DIR/target_before/extensions.tsv" \
            > "$REPORT_DIR/extensions_preflight.diff"; then
            echo "ERROR: Extension source/target chưa giống tuyệt đối (name/version/schema)."
            echo "       Hãy enable đúng extension/version trên project mới rồi chạy lại."
            cat "$REPORT_DIR/extensions_preflight.diff"
            exit 1
          fi
          rm -f "$REPORT_DIR/extensions_preflight.diff"

          MANAGED_RE='^(auth|storage|realtime|graphql|graphql_public|extensions|pgbouncer|pgsodium|pgsodium_masks|vault|cron|supabase_functions|supabase_migrations|net|_realtime|_analytics)$'
          for file in schemas.tsv relations.tsv columns.tsv constraints.tsv indexes.tsv functions.tsv enums.tsv; do
            awk -F '\t' -v re="$MANAGED_RE" '$1 ~ re {print}' \
              "$REPORT_DIR/source_after_backup/$file" > "$RUNNER_TEMP/src-managed-$file"
            awk -F '\t' -v re="$MANAGED_RE" '$1 ~ re {print}' \
              "$REPORT_DIR/target_before/$file" > "$RUNNER_TEMP/dst-managed-$file"
            if ! diff -u "$RUNNER_TEMP/dst-managed-$file" "$RUNNER_TEMP/src-managed-$file" \
              > "$REPORT_DIR/managed_${file%.tsv}.diff"; then
              echo "ERROR: Managed schema base khác nhau ở $file. Không được replay policy/trigger lên nền schema khác version."
              exit 1
            fi
            rm -f "$REPORT_DIR/managed_${file%.tsv}.diff"
          done

          # Policy/trigger ở managed schema KHÔNG thuộc nhóm replay an toàn phải giống tuyệt đối trước restore.
          NON_SYNC_MANAGED_RE='^(graphql|graphql_public|extensions|pgbouncer|pgsodium|pgsodium_masks|supabase_migrations|_realtime|_analytics)$'
          for file in triggers.tsv policies.tsv; do
            awk -F '\t' -v re="$NON_SYNC_MANAGED_RE" '$1 ~ re {print}' \
              "$REPORT_DIR/source_after_backup/$file" > "$RUNNER_TEMP/src-nonsync-$file"
            awk -F '\t' -v re="$NON_SYNC_MANAGED_RE" '$1 ~ re {print}' \
              "$REPORT_DIR/target_before/$file" > "$RUNNER_TEMP/dst-nonsync-$file"
            if ! diff -u "$RUNNER_TEMP/dst-nonsync-$file" "$RUNNER_TEMP/src-nonsync-$file" \
              > "$REPORT_DIR/non_sync_managed_${file%.tsv}.diff"; then
              echo "ERROR: Managed schema ngoài nhóm replay an toàn khác nhau ở $file."
              exit 1
            fi
            rm -f "$REPORT_DIR/non_sync_managed_${file%.tsv}.diff"
          done

          # Shared/platform role attributes phải cùng nền; bỏ validuntil/rolconfig vì có thể là runtime/project-specific.
          awk -F '\t' 'BEGIN{OFS="\t"} FILENAME==ARGV[1] {x[$1]=1; next} !($1 in x) {print $1,$2,$3,$4,$5,$6,$7,$8,$9}' \
            "$REPORT_DIR/source_only_roles.txt" "$REPORT_DIR/source_after_backup/roles.tsv" > "$RUNNER_TEMP/src-shared-role-attrs.tsv"
          awk -F '\t' 'BEGIN{OFS="\t"} FILENAME==ARGV[1] {x[$1]=1; next} !($1 in x) {print $1,$2,$3,$4,$5,$6,$7,$8,$9}' \
            "$REPORT_DIR/source_only_roles.txt" "$REPORT_DIR/target_before/roles.tsv" > "$RUNNER_TEMP/dst-shared-role-attrs.tsv"
          if ! diff -u "$RUNNER_TEMP/dst-shared-role-attrs.tsv" "$RUNNER_TEMP/src-shared-role-attrs.tsv" \
            > "$REPORT_DIR/shared_role_attrs.diff"; then
            echo "ERROR: Thuộc tính static của shared/platform roles khác nhau giữa SOURCE và TARGET."
            exit 1
          fi
          rm -f "$REPORT_DIR/shared_role_attrs.diff"

          # Membership chỉ được phép khác nếu liên quan custom role source-only sẽ được roles.sql restore.
          awk -F '\t' 'FILENAME==ARGV[1] {x[$1]=1; next} !(($1 in x)||($2 in x)) {print}' \
            "$REPORT_DIR/source_only_roles.txt" "$REPORT_DIR/source_after_backup/role_memberships.tsv" | sort -u > "$RUNNER_TEMP/src-shared-memberships.tsv"
          awk -F '\t' 'FILENAME==ARGV[1] {x[$1]=1; next} !(($1 in x)||($2 in x)) {print}' \
            "$REPORT_DIR/source_only_roles.txt" "$REPORT_DIR/target_before/role_memberships.tsv" | sort -u > "$RUNNER_TEMP/dst-shared-memberships.tsv"
          if ! diff -u "$RUNNER_TEMP/dst-shared-memberships.tsv" "$RUNNER_TEMP/src-shared-memberships.tsv" \
            > "$REPORT_DIR/shared_role_memberships.diff"; then
            echo "ERROR: Shared/platform role memberships khác nhau; không tự ghi đè platform role graph."
            exit 1
          fi
          rm -f "$REPORT_DIR/shared_role_memberships.diff"

          # Publication settings + owner phải cùng baseline; explicit table/schema membership sẽ sync chính xác trong transaction.
          awk -F '\t' '$1=="supabase_realtime" {print}' "$REPORT_DIR/source_after_backup/publications.tsv" > "$RUNNER_TEMP/src-realtime-pub.tsv"
          awk -F '\t' '$1=="supabase_realtime" {print}' "$REPORT_DIR/target_before/publications.tsv" > "$RUNNER_TEMP/dst-realtime-pub.tsv"
          if ! diff -u "$RUNNER_TEMP/dst-realtime-pub.tsv" "$RUNNER_TEMP/src-realtime-pub.tsv" \
            > "$REPORT_DIR/realtime_publication_settings.diff"; then
            echo "ERROR: Cấu hình publication supabase_realtime khác nhau; workflow chỉ tự sync membership an toàn."
            exit 1
          fi
          rm -f "$REPORT_DIR/realtime_publication_settings.diff"

          echo "MANAGED BASE COMPATIBILITY: PASSED"

      - name: Chuẩn bị SQL đồng bộ managed policy/trigger/realtime trước transaction restore
        shell: bash
        run: |
          set -Eeuo pipefail

          MANAGED_SQL_LIST="'auth','storage','realtime','cron','vault','net','supabase_functions'"
          MANAGED_SYNC_SQL="$WORK_DIR/managed_sync.sql"
          REALTIME_SYNC_SQL="$WORK_DIR/realtime_sync.sql"
          : > "$MANAGED_SYNC_SQL"
          : > "$REALTIME_SYNC_SQL"

          # Policy: target base đã được chứng minh cùng structure. Xóa non-system policy hiện tại và dựng đúng SOURCE.
          $PSQL "$TARGET_DB_URL" -X -Atq -c "
            SELECT format('DROP POLICY IF EXISTS %I ON %I.%I;',policyname,schemaname,tablename)
            FROM pg_policies
            WHERE schemaname IN ($MANAGED_SQL_LIST)
            ORDER BY schemaname,tablename,policyname;" >> "$MANAGED_SYNC_SQL"

          $PSQL "$SOURCE_DB_URL" -X -Atq -c "
            SELECT format(
              'CREATE POLICY %I ON %I.%I AS %s FOR %s TO %s%s%s;',
              p.policyname,p.schemaname,p.tablename,p.permissive,p.cmd,
              coalesce((SELECT string_agg(quote_ident(role_name), ', ' ORDER BY role_name) FROM unnest(p.roles) AS u(role_name)),'PUBLIC'),
              CASE WHEN p.qual IS NULL THEN '' ELSE ' USING (' || p.qual || ')' END,
              CASE WHEN p.with_check IS NULL THEN '' ELSE ' WITH CHECK (' || p.with_check || ')' END
            )
            FROM pg_policies p
            WHERE p.schemaname IN ($MANAGED_SQL_LIST)
            ORDER BY p.schemaname,p.tablename,p.policyname;" >> "$MANAGED_SYNC_SQL"

          # Trigger: non-internal only; giữ cả trạng thái O/D/R/A.
          $PSQL "$TARGET_DB_URL" -X -Atq -c "
            SELECT format('DROP TRIGGER IF EXISTS %I ON %I.%I;',t.tgname,n.nspname,c.relname)
            FROM pg_trigger t
            JOIN pg_class c ON c.oid=t.tgrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE NOT t.tgisinternal AND n.nspname IN ($MANAGED_SQL_LIST)
            ORDER BY n.nspname,c.relname,t.tgname;" >> "$MANAGED_SYNC_SQL"

          $PSQL "$SOURCE_DB_URL" -X -Atq -c "
            SELECT pg_get_triggerdef(t.oid,true) || ';' || E'\\n' ||
                   CASE t.tgenabled
                     WHEN 'D' THEN format('ALTER TABLE %I.%I DISABLE TRIGGER %I;',n.nspname,c.relname,t.tgname)
                     WHEN 'R' THEN format('ALTER TABLE %I.%I ENABLE REPLICA TRIGGER %I;',n.nspname,c.relname,t.tgname)
                     WHEN 'A' THEN format('ALTER TABLE %I.%I ENABLE ALWAYS TRIGGER %I;',n.nspname,c.relname,t.tgname)
                     ELSE format('ALTER TABLE %I.%I ENABLE TRIGGER %I;',n.nspname,c.relname,t.tgname)
                   END
            FROM pg_trigger t
            JOIN pg_class c ON c.oid=t.tgrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE NOT t.tgisinternal AND n.nspname IN ($MANAGED_SQL_LIST)
            ORDER BY n.nspname,c.relname,t.tgname;" >> "$MANAGED_SYNC_SQL"

          # Realtime publication: đồng bộ catalog trực tiếp để giữ row filter, column list và TABLES IN SCHEMA.
          if grep -q $'^supabase_realtime\t' "$REPORT_DIR/source_after_backup/publications.tsv"; then
            PUB_ALL=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT puballtables FROM pg_publication WHERE pubname='supabase_realtime';")
            if [ "$PUB_ALL" != "t" ]; then
              $PSQL "$TARGET_DB_URL" -X -Atq -c "
                SELECT format('ALTER PUBLICATION supabase_realtime DROP TABLE %I.%I;',n.nspname,c.relname)
                FROM pg_publication_rel pr
                JOIN pg_publication p ON p.oid=pr.prpubid
                JOIN pg_class c ON c.oid=pr.prrelid
                JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE p.pubname='supabase_realtime' ORDER BY n.nspname,c.relname;" >> "$REALTIME_SYNC_SQL"
              $PSQL "$TARGET_DB_URL" -X -Atq -c "
                SELECT format('ALTER PUBLICATION supabase_realtime DROP TABLES IN SCHEMA %I;',n.nspname)
                FROM pg_publication_namespace pn
                JOIN pg_publication p ON p.oid=pn.pnpubid
                JOIN pg_namespace n ON n.oid=pn.pnnspid
                WHERE p.pubname='supabase_realtime' ORDER BY n.nspname;" >> "$REALTIME_SYNC_SQL"
              $PSQL "$SOURCE_DB_URL" -X -Atq -c "
                SELECT format('ALTER PUBLICATION supabase_realtime ADD TABLES IN SCHEMA %I;',n.nspname)
                FROM pg_publication_namespace pn
                JOIN pg_publication p ON p.oid=pn.pnpubid
                JOIN pg_namespace n ON n.oid=pn.pnnspid
                WHERE p.pubname='supabase_realtime' ORDER BY n.nspname;" >> "$REALTIME_SYNC_SQL"
              $PSQL "$SOURCE_DB_URL" -X -Atq -c "
                SELECT format(
                  'ALTER PUBLICATION supabase_realtime ADD TABLE %I.%I%s%s;',
                  n.nspname,c.relname,
                  CASE WHEN pr.prattrs IS NULL THEN '' ELSE
                    ' (' || (SELECT string_agg(quote_ident(a.attname), ', ' ORDER BY u.ord)
                              FROM unnest(pr.prattrs::smallint[]) WITH ORDINALITY AS u(attnum,ord)
                              JOIN pg_attribute a ON a.attrelid=pr.prrelid AND a.attnum=u.attnum) || ')' END,
                  CASE WHEN pr.prqual IS NULL THEN '' ELSE ' WHERE (' || pg_get_expr(pr.prqual,pr.prrelid) || ')' END
                )
                FROM pg_publication_rel pr
                JOIN pg_publication p ON p.oid=pr.prpubid
                JOIN pg_class c ON c.oid=pr.prrelid
                JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE p.pubname='supabase_realtime' ORDER BY n.nspname,c.relname;" >> "$REALTIME_SYNC_SQL"
            fi
          fi

          # Migration history trên hosted project mới phải có cùng base structure; chỉ thay data trong transaction.
          SRC_MIG=$($PSQL "$SOURCE_DB_URL" -X -Atqc "SELECT to_regclass('supabase_migrations.schema_migrations') IS NOT NULL;")
          DST_MIG=$($PSQL "$TARGET_DB_URL" -X -Atqc "SELECT to_regclass('supabase_migrations.schema_migrations') IS NOT NULL;")
          if [ "$SRC_MIG" = "t" ] && [ "$DST_MIG" != "t" ]; then
            echo "ERROR: SOURCE có migration history nhưng TARGET thiếu supabase_migrations.schema_migrations."
            exit 1
          fi

          cat > "$WORK_DIR/pre_restore.sql" <<'SQL'
          ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;
          SQL

          if [ "$SRC_MIG" = "t" ]; then
            echo "TRUNCATE TABLE supabase_migrations.schema_migrations;" > "$WORK_DIR/migration_history_prepare.sql"
          else
            : > "$WORK_DIR/migration_history_prepare.sql"
          fi

          python3 "$WORK_DIR/build_precommit_guard.py" \
            "$REPORT_DIR/source_after_backup/data_fingerprints.tsv" \
            "$REPORT_DIR/source_after_backup/sequence_values.tsv" \
            "$REPORT_DIR/source_after_backup/large_objects.tsv" \
            "$WORK_DIR/precommit_guard.sql"
          test -s "$WORK_DIR/precommit_guard.sql"

          sed -E '/GRANT "postgres" TO "cli_login_postgres"/d' \
            "$BACKUP_DIR/roles.sql" > "$BACKUP_DIR/roles.restore.sql"

          if grep -Eq 'ALTER .* OWNER TO "?supabase_admin"?;' "$BACKUP_DIR/schema.sql"; then
            echo "ERROR: schema.sql chứa OWNER TO supabase_admin; strict clone không tự đổi ownership vì sẽ làm lệch SOURCE."
            exit 1
          fi

      - name: Atomic restore - roles + schema + data + migration history + managed sync
        shell: bash
        env:
          SOURCE_PROJECT_REF: ${{ secrets.SOURCE_PROJECT_REF }}
          TARGET_PROJECT_REF: ${{ secrets.TARGET_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && echo "::add-mask::$SUPABASE_ACCESS_TOKEN"

          KEY_CHANGED=0
          SRC_KEY_FILE="$RUNNER_TEMP/source-root-key.json"
          DST_KEY_FILE="$RUNNER_TEMP/target-root-key-original.json"
          KEY_VERIFY_FILE="$RUNNER_TEMP/target-root-key-verify.json"
          KEY_ROLLBACK_VERIFY_FILE="$RUNNER_TEMP/target-root-key-rollback-verify.json"
          KEY_CHANGED_MARKER="$WORK_DIR/vault_key_changed.marker"
          VAULT_CRITICAL_MARKER="$WORK_DIR/VAULT_ROLLBACK_FAILED.txt"

          json_equal_secret() {
            local left="$1" right="$2"
            local left_norm right_norm
            left_norm=$(mktemp "$RUNNER_TEMP/key-left.XXXXXX")
            right_norm=$(mktemp "$RUNNER_TEMP/key-right.XXXXXX")
            chmod 600 "$left_norm" "$right_norm"
            if ! jq -S -c . "$left" > "$left_norm" || ! jq -S -c . "$right" > "$right_norm"; then
              rm -f "$left_norm" "$right_norm"
              return 1
            fi
            cmp -s "$left_norm" "$right_norm"
            local rc=$?
            rm -f "$left_norm" "$right_norm"
            return "$rc"
          }

          get_target_root_key() {
            local out="$1" http
            http=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$out" -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/pgsodium" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}") || return 1
            [ "$http" -ge 200 ] && [ "$http" -lt 300 ] || return 1
            jq -e 'type == "object"' "$out" >/dev/null || return 1
          }

          restore_original_target_key() {
            [ "$KEY_CHANGED" -eq 1 ] || return 0
            [ -s "$DST_KEY_FILE" ] || return 1
            echo "Khôi phục và xác minh root encryption key nguyên bản của TARGET..."
            local http
            http=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$RUNNER_TEMP/key-rollback-result.txt" -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/pgsodium" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              -X PUT --data-binary "@$DST_KEY_FILE") || return 1
            rm -f "$RUNNER_TEMP/key-rollback-result.txt"
            [ "$http" -ge 200 ] && [ "$http" -lt 300 ] || return 1
            get_target_root_key "$KEY_ROLLBACK_VERIFY_FILE" || return 1
            json_equal_secret "$DST_KEY_FILE" "$KEY_ROLLBACK_VERIFY_FILE" || return 1
            KEY_CHANGED=0
            rm -f "$KEY_CHANGED_MARKER" "$KEY_ROLLBACK_VERIFY_FILE"
            echo "Vault rollback verification: PASSED"
          }

          cleanup_on_exit() {
            local rc=$?
            trap - EXIT INT TERM
            if [ "$rc" -ne 0 ] && [ "$KEY_CHANGED" -eq 1 ]; then
              if ! restore_original_target_key; then
                printf '%s\n' \
                  'CRITICAL: Không thể xác minh việc khôi phục root encryption key nguyên bản của TARGET.' \
                  'KHÔNG sử dụng TARGET cho đến khi root key được phục hồi và xác minh thủ công.' \
                  > "$VAULT_CRITICAL_MARKER"
                chmod 600 "$VAULT_CRITICAL_MARKER"
                echo "CRITICAL: Vault rollback thất bại hoặc không thể xác minh. TARGET cần can thiệp thủ công." >&2
              fi
            fi
            rm -f "$KEY_VERIFY_FILE" "$KEY_ROLLBACK_VERIFY_FILE"
            exit "$rc"
          }
          trap cleanup_on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Root key chỉ được thay ngay trước transaction restore. Sau PUT bắt buộc GET lại và so khớp bí mật.
          if [ "${VAULT_KEY_REQUIRED:-0}" = "1" ]; then
            # Đánh dấu TRƯỚC request: nếu connection đứt sau khi server đã áp dụng PUT, safety step vẫn biết phải phục hồi.
            KEY_CHANGED=1
            : > "$KEY_CHANGED_MARKER"
            chmod 600 "$KEY_CHANGED_MARKER"
            HTTP_PUT=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$RUNNER_TEMP/key-put-result.txt" -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/pgsodium" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              -X PUT --data-binary "@$SRC_KEY_FILE")
            rm -f "$RUNNER_TEMP/key-put-result.txt"
            if [ "$HTTP_PUT" -lt 200 ] || [ "$HTTP_PUT" -ge 300 ]; then
              echo "ERROR: Không ghi được root encryption key sang TARGET (HTTP $HTTP_PUT)."
              exit 1
            fi
            if ! get_target_root_key "$KEY_VERIFY_FILE" || ! json_equal_secret "$SRC_KEY_FILE" "$KEY_VERIFY_FILE"; then
              echo "ERROR: Root encryption key TARGET sau PUT không thể xác minh là giống SOURCE. Sẽ rollback." >&2
              exit 1
            fi
            rm -f "$KEY_VERIFY_FILE"
            echo "Vault source-key verification on TARGET: PASSED"
          fi

          FILE_ARGS=(
            --file "$WORK_DIR/pre_restore.sql"
            --file "$BACKUP_DIR/roles.restore.sql"
            --file "$BACKUP_DIR/schema.sql"
            --command 'SET session_replication_role = replica'
            --file "$BACKUP_DIR/data.sql"
            --command 'SET session_replication_role = origin'
            --file "$WORK_DIR/migration_history_prepare.sql"
          )
          if [ -s "$BACKUP_DIR/migration_history_data.sql" ]; then
            FILE_ARGS+=(--file "$BACKUP_DIR/migration_history_data.sql")
          fi
          FILE_ARGS+=(
            --file "$WORK_DIR/managed_sync.sql"
            --file "$WORK_DIR/realtime_sync.sql"
            --file "$WORK_DIR/precommit_guard.sql"
          )

          # Một psql + một transaction: nếu bất kỳ DDL/DML/managed-sync lỗi, toàn bộ DB restore rollback.
          $PSQL "$TARGET_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            "${FILE_ARGS[@]}"

          touch "$WORK_DIR/restore_committed.marker"
          KEY_CHANGED=0
          rm -f "$KEY_CHANGED_MARKER"
          trap - EXIT INT TERM
          echo "ATOMIC RESTORE: COMMITTED"

      - name: Safety rollback + verify Vault key nếu restore chưa commit
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_PROJECT_REF: ${{ secrets.TARGET_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          DST_KEY_FILE="$RUNNER_TEMP/target-root-key-original.json"
          VERIFY_FILE="$RUNNER_TEMP/target-root-key-safety-verify.json"
          CRITICAL_MARKER="$WORK_DIR/VAULT_ROLLBACK_FAILED.txt"
          KEY_CHANGED_MARKER="$WORK_DIR/vault_key_changed.marker"

          if [ "${VAULT_KEY_REQUIRED:-0}" != "1" ] || [ -f "$WORK_DIR/restore_committed.marker" ] || [ ! -f "$KEY_CHANGED_MARKER" ]; then
            exit 0
          fi
          if [ ! -s "$DST_KEY_FILE" ]; then
            echo "CRITICAL: Restore chưa commit nhưng không còn bản root key nguyên bản của TARGET để safety rollback." >&2
            printf '%s\n' 'CRITICAL: Missing original TARGET root key during safety rollback.' > "$CRITICAL_MARKER"
            exit 1
          fi

          echo "Safety rollback: restore chưa commit; phục hồi và xác minh root key TARGET."
          if ! HTTP_PUT=$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o "$RUNNER_TEMP/key-safety-rollback-result.txt" -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/pgsodium" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -X PUT --data-binary "@$DST_KEY_FILE"); then
            printf '%s\n' 'CRITICAL: Vault safety rollback PUT transport failed.' > "$CRITICAL_MARKER"
            echo "CRITICAL: Safety rollback Vault lỗi kết nối/transport." >&2
            rm -f "$RUNNER_TEMP/key-safety-rollback-result.txt"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/key-safety-rollback-result.txt"
          if [ "$HTTP_PUT" -lt 200 ] || [ "$HTTP_PUT" -ge 300 ]; then
            printf '%s\n' "CRITICAL: Vault safety rollback PUT failed HTTP $HTTP_PUT." > "$CRITICAL_MARKER"
            echo "CRITICAL: Safety rollback Vault thất bại (HTTP $HTTP_PUT)." >&2
            exit 1
          fi

          if ! HTTP_GET=$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o "$VERIFY_FILE" -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/pgsodium" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"); then
            printf '%s\n' 'CRITICAL: Vault safety rollback verification GET transport failed.' > "$CRITICAL_MARKER"
            echo "CRITICAL: Không thể GET root key để xác minh safety rollback do lỗi transport." >&2
            rm -f "$VERIFY_FILE"
            exit 1
          fi
          if [ "$HTTP_GET" -lt 200 ] || [ "$HTTP_GET" -ge 300 ] || ! jq -e 'type == "object"' "$VERIFY_FILE" >/dev/null; then
            printf '%s\n' 'CRITICAL: Vault safety rollback could not be verified by GET.' > "$CRITICAL_MARKER"
            echo "CRITICAL: Không thể GET/xác minh root key sau safety rollback." >&2
            rm -f "$VERIFY_FILE"
            exit 1
          fi

          ORIG_NORM=$(mktemp "$RUNNER_TEMP/key-orig.XXXXXX")
          VERIFY_NORM=$(mktemp "$RUNNER_TEMP/key-verify.XXXXXX")
          chmod 600 "$ORIG_NORM" "$VERIFY_NORM"
          jq -S -c . "$DST_KEY_FILE" > "$ORIG_NORM"
          jq -S -c . "$VERIFY_FILE" > "$VERIFY_NORM"
          if ! cmp -s "$ORIG_NORM" "$VERIFY_NORM"; then
            rm -f "$VERIFY_FILE" "$ORIG_NORM" "$VERIFY_NORM"
            printf '%s\n' 'CRITICAL: Vault safety rollback verification mismatch.' > "$CRITICAL_MARKER"
            echo "CRITICAL: Root key sau safety rollback không khớp bản nguyên gốc." >&2
            exit 1
          fi
          rm -f "$VERIFY_FILE" "$ORIG_NORM" "$VERIFY_NORM" "$CRITICAL_MARKER" "$KEY_CHANGED_MARKER"
          echo "Vault safety rollback verification: PASSED"

      - name: Kiểm chứng sau restore - deep manifest + canonical COPY hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          "$WORK_DIR/inventory.sh" "$TARGET_DB_URL" "$REPORT_DIR/target_after"

          $PG_DUMP "$TARGET_DB_URL" --schema-only \
            | sed -E '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^\\(un)?restrict /d' \
            > "$REPORT_DIR/target_schema_canonical.sql"

          : > "$REPORT_DIR/verification_summary.txt"
          FAILED=0

          FILES=(
            schemas.tsv extensions.tsv database_properties.tsv collations.tsv relations.tsv columns.tsv constraints.tsv indexes.tsv
            functions.tsv triggers.tsv policies.tsv publications.tsv publication_tables.tsv publication_relations.tsv publication_schemas.tsv
            enums.tsv sequence_defs.tsv sequence_values.tsv
            db_role_settings.tsv default_acl.tsv event_triggers.tsv foreign_servers.tsv foreign_tables.tsv
            user_mappings.tsv custom_tablespaces.tsv large_objects.tsv subscriptions.tsv replication_slots.tsv
          )

          for f in "${FILES[@]}"; do
            if diff -u "$REPORT_DIR/source_after_backup/$f" "$REPORT_DIR/target_after/$f" \
              > "$REPORT_DIR/verify_${f%.tsv}.diff"; then
              echo "PASS $f" | tee -a "$REPORT_DIR/verification_summary.txt"
              rm -f "$REPORT_DIR/verify_${f%.tsv}.diff"
            else
              echo "FAIL $f" | tee -a "$REPORT_DIR/verification_summary.txt"
              FAILED=1
            fi
          done

          filter_clone_data() {
            grep -Ev $'^(auth\tschema_migrations\t|storage\tmigrations\t|realtime\tschema_migrations\t|supabase_functions\tmigrations\t)' "$1" || true
          }
          filter_clone_data "$REPORT_DIR/source_after_backup/data_fingerprints.tsv" > "$RUNNER_TEMP/source_clone_data.tsv"
          filter_clone_data "$REPORT_DIR/target_after/data_fingerprints.tsv" > "$RUNNER_TEMP/target_clone_data.tsv"
          if diff -u "$RUNNER_TEMP/source_clone_data.tsv" "$RUNNER_TEMP/target_clone_data.tsv" \
            > "$REPORT_DIR/verify_clone_data_fingerprints.diff"; then
            echo "PASS clone_data_fingerprints" | tee -a "$REPORT_DIR/verification_summary.txt"
            rm -f "$REPORT_DIR/verify_clone_data_fingerprints.diff"
          else
            echo "FAIL clone_data_fingerprints" | tee -a "$REPORT_DIR/verification_summary.txt"
            FAILED=1
          fi

          # Custom roles: chỉ so role source-only; platform roles do Supabase quản lý không được giả vờ clone password/runtime attrs.
          : > "$RUNNER_TEMP/source_custom_roles.tsv"
          : > "$RUNNER_TEMP/target_custom_roles.tsv"
          while IFS= read -r role; do
            [ -n "$role" ] || continue
            awk -F '\t' -v r="$role" '$1==r' "$REPORT_DIR/source_after_backup/roles.tsv" >> "$RUNNER_TEMP/source_custom_roles.tsv"
            awk -F '\t' -v r="$role" '$1==r' "$REPORT_DIR/target_after/roles.tsv" >> "$RUNNER_TEMP/target_custom_roles.tsv"
          done < "$REPORT_DIR/source_only_roles.txt"
          if diff -u "$RUNNER_TEMP/source_custom_roles.tsv" "$RUNNER_TEMP/target_custom_roles.tsv" \
            > "$REPORT_DIR/verify_custom_roles.diff"; then
            echo "PASS custom_roles" | tee -a "$REPORT_DIR/verification_summary.txt"
            rm -f "$REPORT_DIR/verify_custom_roles.diff"
          else
            echo "FAIL custom_roles" | tee -a "$REPORT_DIR/verification_summary.txt"
            FAILED=1
          fi

          : > "$RUNNER_TEMP/source_custom_memberships.tsv"
          : > "$RUNNER_TEMP/target_custom_memberships.tsv"
          while IFS= read -r role; do
            [ -n "$role" ] || continue
            awk -F '\t' -v r="$role" '$1==r || $2==r' "$REPORT_DIR/source_after_backup/role_memberships.tsv" >> "$RUNNER_TEMP/source_custom_memberships.tsv"
            awk -F '\t' -v r="$role" '$1==r || $2==r' "$REPORT_DIR/target_after/role_memberships.tsv" >> "$RUNNER_TEMP/target_custom_memberships.tsv"
          done < "$REPORT_DIR/source_only_roles.txt"
          sort -u "$RUNNER_TEMP/source_custom_memberships.tsv" -o "$RUNNER_TEMP/source_custom_memberships.tsv"
          sort -u "$RUNNER_TEMP/target_custom_memberships.tsv" -o "$RUNNER_TEMP/target_custom_memberships.tsv"
          if diff -u "$RUNNER_TEMP/source_custom_memberships.tsv" "$RUNNER_TEMP/target_custom_memberships.tsv" \
            > "$REPORT_DIR/verify_custom_role_memberships.diff"; then
            echo "PASS custom_role_memberships" | tee -a "$REPORT_DIR/verification_summary.txt"
            rm -f "$REPORT_DIR/verify_custom_role_memberships.diff"
          else
            echo "FAIL custom_role_memberships" | tee -a "$REPORT_DIR/verification_summary.txt"
            FAILED=1
          fi

          if diff -u "$REPORT_DIR/source_schema_after_dump.sql" "$REPORT_DIR/target_schema_canonical.sql" \
            > "$REPORT_DIR/verify_full_schema_canonical.diff"; then
            echo "PASS full_schema_canonical" | tee -a "$REPORT_DIR/verification_summary.txt"
            rm -f "$REPORT_DIR/verify_full_schema_canonical.diff"
          else
            echo "FAIL full_schema_canonical" | tee -a "$REPORT_DIR/verification_summary.txt"
            FAILED=1
          fi

          if [ "$DEEP_VERIFY_DATA_DUMP" = "true" ]; then
            CLI_DIR="$RUNNER_TEMP/supabase-cli-isolated"
            mkdir -p "$CLI_DIR"
            (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$REPORT_DIR/target_data_verify.sql" --data-only --use-copy \
              -x storage.buckets_vectors -x storage.vector_indexes --remote="$TARGET_DB_URL")
            python3 "$WORK_DIR/copy_hashes.py" "$REPORT_DIR/target_data_verify.sql" \
              "$REPORT_DIR/target_copy_hashes.tsv" "$RUNNER_TEMP/copyhash-target"
            if diff -u "$REPORT_DIR/official_copy_hashes.tsv" "$REPORT_DIR/target_copy_hashes.tsv" \
              > "$REPORT_DIR/verify_data_roundtrip_copy_hashes.diff"; then
              echo "PASS data_roundtrip_canonical_copy_hashes" | tee -a "$REPORT_DIR/verification_summary.txt"
              rm -f "$REPORT_DIR/verify_data_roundtrip_copy_hashes.diff"
            else
              echo "FAIL data_roundtrip_canonical_copy_hashes" | tee -a "$REPORT_DIR/verification_summary.txt"
              FAILED=1
            fi

            if [ -s "$REPORT_DIR/migration_history_copy_hashes.tsv" ]; then
              (cd "$CLI_DIR" && supabase db dump -f "$GITHUB_WORKSPACE/$REPORT_DIR/target_migration_history_verify.sql" \
                --schema supabase_migrations --data-only --use-copy --remote="$TARGET_DB_URL")
              python3 "$WORK_DIR/copy_hashes.py" "$REPORT_DIR/target_migration_history_verify.sql" \
                "$REPORT_DIR/target_migration_history_copy_hashes.tsv" "$RUNNER_TEMP/copyhash-target-migrations"
              if diff -u "$REPORT_DIR/migration_history_copy_hashes.tsv" "$REPORT_DIR/target_migration_history_copy_hashes.tsv" \
                > "$REPORT_DIR/verify_migration_history_roundtrip.diff"; then
                echo "PASS migration_history_roundtrip_copy_hashes" | tee -a "$REPORT_DIR/verification_summary.txt"
                rm -f "$REPORT_DIR/verify_migration_history_roundtrip.diff"
              else
                echo "FAIL migration_history_roundtrip_copy_hashes" | tee -a "$REPORT_DIR/verification_summary.txt"
                FAILED=1
              fi
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "VERIFICATION: FAILED - TARGET chưa thể được chứng minh giống SOURCE snapshot." | tee -a "$REPORT_DIR/verification_summary.txt"
            exit 1
          fi

          echo "VERIFICATION: PASSED - manifest + checksum + canonical schema + canonical COPY hashes đều khớp trong phạm vi logical DB clone." \
            | tee -a "$REPORT_DIR/verification_summary.txt"

      - name: Tạo báo cáo kết luận
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p "$REPORT_DIR" "$WORK_DIR/artifact-safe"
          {
            echo "Supabase Database Clone V4 FINAL - Maximum Assurance"
            echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "job_status=$JOB_STATUS"
            echo
            echo "Nguyên tắc: fail-closed; không tuyên bố thành công khi không chứng minh được."
            echo "Restore: một transaction cho roles + schema + data + migration history + managed policy/trigger + realtime membership + pre-commit data/sequence/LO guard."
            echo "Security: backup chi tiết chỉ được upload dưới dạng mã hóa đối xứng AES256/GPG."
            echo "Verification: full manifests + matview populated-state + exact publication catalog + exact row counts + 5 hash aggregates/table + canonical COPY SHA-256 + sequence + canonical schema."
            echo "Platform limitation: Storage blobs/Edge Functions/Auth provider settings/API keys nằm ngoài PostgreSQL DB clone."
            echo
            if [ -f "$REPORT_DIR/verification_summary.txt" ]; then
              cat "$REPORT_DIR/verification_summary.txt"
            fi
            if [ -f "$REPORT_DIR/nonportable.txt" ]; then
              echo
              echo "--- Platform/nonportable notes ---"
              cat "$REPORT_DIR/nonportable.txt"
            fi
            if [ -f "$WORK_DIR/VAULT_ROLLBACK_FAILED.txt" ]; then
              echo
              echo "--- CRITICAL VAULT RECOVERY STATUS ---"
              cat "$WORK_DIR/VAULT_ROLLBACK_FAILED.txt"
            fi
          } > "$REPORT_DIR/FINAL_REPORT.txt"
          cat "$REPORT_DIR/FINAL_REPORT.txt"

      - name: Đóng gói Artifact mã hóa - không upload plaintext database
        id: encrypt_artifact
        if: ${{ always() && inputs.save_backup_artifact }}
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK_DIR/artifact-safe"
          echo "::add-mask::$BACKUP_ENCRYPTION_PASSWORD"

          if [ -z "${BACKUP_ENCRYPTION_PASSWORD:-}" ]; then
            echo "ERROR: Thiếu BACKUP_ENCRYPTION_PASSWORD; từ chối upload backup plaintext."
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSWORD}" -lt 20 ]; then
            echo "ERROR: BACKUP_ENCRYPTION_PASSWORD phải có tối thiểu 20 ký tự."
            exit 1
          fi

          # Packaging cần đồng thời plaintext + tar.zst + encrypted output; kiểm tra headroom theo kích thước thực tế.
          PLAIN_BYTES=$(du -sb "$REPORT_DIR" "$BACKUP_DIR" 2>/dev/null | awk '{s+=$1} END{print s+0}')
          FREE_BYTES=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          NEED_PACK_BYTES=$(( PLAIN_BYTES * 2 + 1073741824 ))
          if [ "$FREE_BYTES" -lt "$NEED_PACK_BYTES" ]; then
            echo "ERROR: Không đủ disk headroom để đóng gói+mã hóa an toàn. free=$FREE_BYTES need=$NEED_PACK_BYTES"
            exit 1
          fi

          TAR_FILE="$RUNNER_TEMP/supabase-clone-${GITHUB_RUN_ID}.tar.zst"
          ENC_FILE="$WORK_DIR/artifact-safe/supabase-clone-${GITHUB_RUN_ID}.tar.zst.gpg"
          cleanup_tar() { rm -f "$TAR_FILE"; }
          trap cleanup_tar EXIT INT TERM

          TAR_ITEMS=(report)
          [ -d "$BACKUP_DIR" ] && TAR_ITEMS+=(backup)
          tar -C "$WORK_DIR" --zstd -cf "$TAR_FILE" "${TAR_ITEMS[@]}"
          printf '%s' "$BACKUP_ENCRYPTION_PASSWORD" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 \
            --output "$ENC_FILE" "$TAR_FILE"

          # Round-trip check: chỉ xóa plaintext sau khi archive mã hóa giải mã kiểm tra thành công.
          printf '%s' "$BACKUP_ENCRYPTION_PASSWORD" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /dev/null "$ENC_FILE"

          sha256sum "$ENC_FILE" > "$WORK_DIR/artifact-safe/ENCRYPTED_ARTIFACT.sha256"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          rm -f "$TAR_FILE"
          trap - EXIT INT TERM

          # Defense in depth: xóa plaintext chứa dữ liệu trước bước upload.
          rm -rf "$BACKUP_DIR" "$REPORT_DIR"

      - name: Upload Artifact an toàn
        if: ${{ always() && inputs.save_backup_artifact && steps.encrypt_artifact.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-database-clone-encrypted-${{ github.run_id }}
          path: |
            clone-work/artifact-safe/supabase-clone-${{ github.run_id }}.tar.zst.gpg
            clone-work/artifact-safe/ENCRYPTED_ARTIFACT.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Dọn file nhạy cảm tạm thời
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/source-root-key.json" "$RUNNER_TEMP/target-root-key-original.json" \
                "$RUNNER_TEMP/target-root-key-verify.json" "$RUNNER_TEMP/target-root-key-rollback-verify.json" \
                "$RUNNER_TEMP/target-root-key-safety-verify.json" "$RUNNER_TEMP/key-put-result.txt" \
                "$RUNNER_TEMP/key-rollback-result.txt" "$RUNNER_TEMP/key-safety-rollback-result.txt" \
                "$RUNNER_TEMP"/key-left.* "$RUNNER_TEMP"/key-right.* "$RUNNER_TEMP"/key-orig.* "$RUNNER_TEMP"/key-verify.*
          rm -rf "$WORK_DIR"
